<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: https://alvis1.github.io; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Cache-busting for the deployed SPA on GitHub Pages.
      The hashed JS/CSS assets in /assets/ are content-hashed by Vite, so
      they're safe to cache forever. But the HTML file points at those hashes
      and changes every deploy — if the browser caches it, users on a stale
      tab will keep loading old asset URLs that 404 after we redeploy.
      Telling the browser to always revalidate the HTML solves this without
      hurting first-paint performance: the HTML is tiny (~1 KB) and only
      its 304 round-trip is added; the heavy assets keep their cache hits.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Substituted at build time by the fs-version-html plugin in vite.config.ts -->
    <meta name="version" content="0.3.33" />
    <title>FastShaders - TSL Visual Shader Editor</title>
    <!-- The app mark, from public/ (a leading slash is the documented way to
         reference a public asset — Vite prefixes the deploy base, which differs
         across gh-pages, alvismisjuns and the desktop shell). Same-origin, so
         it still resolves with no network; it also kills the browser's
         automatic /favicon.ico 404. -->
    <link rel="icon" type="image/svg+xml" href="/FastShaders/images/favicon-app.svg" />
    <!-- Fonts are self-hosted (@fontsource imports in main.tsx) so the app works offline. -->
    <!--
      Stamp the persisted theme before first paint so a dark-mode session doesn't
      flash light while the JS/CSS bundle loads. The store re-applies data-theme
      on init and on every toggle; the inline background mirrors tokens.css
      --bg-app so the pre-CSS frame matches too.
    -->
    <script>
      try {
        var dark = localStorage.getItem('fs:codeEditorTheme') === 'vs-dark';
        var el = document.documentElement;
        el.setAttribute('data-theme', dark ? 'dark' : 'light');
        el.style.background = dark ? '#17181b' : '#F5F5F5';
        // Stamp the persisted UI language too. This MUST mirror the store's own
        // resolution (useAppStore.ts: `loadString('fs:lang','en') === 'lv' ? 'lv' : 'en'`)
        // — English is the DEFAULT, so an ABSENT key means 'en'. Reading it
        // the other way round is what left every first-time visitor with a document
        // advertising English while the UI rendered Latvian: wrong screen-reader
        // phonetics, a browser 'translate from English' prompt, and an English
        // spellcheck dictionary over Latvian note and shader-name input (WCAG 3.1.1).
        el.setAttribute('lang', localStorage.getItem('fs:lang') === 'lv' ? 'lv' : 'en');
      } catch (e) { /* private mode / storage disabled — default light */ }
    </script>
    <script type="module" crossorigin src="/FastShaders/assets/main-Dh1-9qHX.js"></script>
    <link rel="modulepreload" crossorigin href="/FastShaders/assets/vendor-react-CVkjjuGB.js">
    <link rel="modulepreload" crossorigin href="/FastShaders/assets/preload-DiXeQ6_L.js">
    <link rel="modulepreload" crossorigin href="/FastShaders/assets/vendor-xyflow-CIfuUpQH.js">
    <link rel="modulepreload" crossorigin href="/FastShaders/assets/vendor-dagre-CdVMPvTX.js">
    <link rel="modulepreload" crossorigin href="/FastShaders/assets/tokens-BRj_uTkc.js">

    <link rel="modulepreload" crossorigin href="/FastShaders/assets/builtinPresets-WZwP6UA8.js">

  </head>
  <body>
    <div id="root"></div>
    <!--
      The app is one bare `<script type="module">` into an empty #root, built at
      `target: 'esnext'` with no polyfills — so a browser that cannot PARSE the
      entry chunk (monaco's ES2022 class static blocks, the A-Frame bundle's own)
      or that lacks something the boot path needs shows a page with nothing on it
      at all, and there is no ErrorBoundary anywhere to say otherwise. A blank
      page is indistinguishable from a broken deploy, and the user study runs on
      machines the researcher does not control.

      Two fallbacks, both deliberately unable to take the app away from anyone:
      <noscript> for JS off, and a watchdog that speaks ONLY when #root is still
      empty — i.e. exactly when the app really did not start. It never
      feature-tests, because every candidate test (structuredClone, :has(),
      color-mix) has browsers where the app boots and stays useful, and blocking
      those would be a regression; and the note lives OUTSIDE #root, so React
      owns its container either way.
    -->
    <noscript>
      <p style="font: 16px/1.5 system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        FastShaders ir vizuāls ēnotāju redaktors — tam nepieciešams JavaScript.<br />
        FastShaders is a visual shader editor — it needs JavaScript to run.
      </p>
    </noscript>
    <div id="boot-fallback" style="display: none; font: 16px/1.5 system-ui, sans-serif; padding: 2rem; max-width: 40rem">
      <p>
        FastShaders nesāka darboties. Parasti tas nozīmē, ka pārlūks ir par vecu —
        nepieciešams Chrome 111+, Safari 16.4+ vai Firefox 126+.
      </p>
      <p>
        FastShaders did not start. This usually means the browser is too old — it
        needs Chrome 111+, Safari 16.4+ or Firefox 126+.
      </p>
    </div>
    <script>
      // A CLASSIC script on purpose: a browser that cannot parse the module
      // below still runs this one, which is the whole point.
      (function () {
        var root = document.getElementById('root');
        var note = document.getElementById('boot-fallback');
        if (!root || !note) return;
        var ticks = 0;
        // Polled rather than a single timeout: the boot wave is ~650 KB gz, so a
        // slow link can legitimately take longer than the 15 s grace period — if
        // the app arrives after the note is shown, the next tick takes it back
        // down. Polling stops at 2 min either way.
        var timer = setInterval(function () {
          if (root.firstChild) {
            note.style.display = 'none';
            clearInterval(timer);
            return;
          }
          ticks++;
          if (ticks >= 15) note.style.display = 'block';
          if (ticks >= 120) clearInterval(timer);
        }, 1000);
      })();
    </script>
  </body>
</html>
