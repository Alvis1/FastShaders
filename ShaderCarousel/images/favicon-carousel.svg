<!--
  ShaderCarousel mark: the S/C monogram. Used by ShaderCarousel/index.html (the
  launcher — the bench pages inside it are iframes and never own a tab).

  As with the Podest icon, the authored file also carries the FastShaders S+F,
  parked ~1519 units LEFT of its own 374×375 viewBox: the three icons sat side
  by side on one canvas and each export kept its neighbours' artwork. It never
  rendered, so it is dropped here instead of shipping as invisible geometry.
  The viewBox is squared and centred with ~5% margin, and the "S" carries
  class="ink" + a prefers-color-scheme rule — it is the one black shape, and a
  black glyph on a dark tab strip is an invisible one.
-->
