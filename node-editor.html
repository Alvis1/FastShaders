<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastShaders — Node & Graph Overview</title>
    <!-- SVG favicon — kills the automatic /favicon.ico 404 (same as index.html) -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon-app.svg" />
    <!--
      LOCALHOST TOOL — deliberately not in vite.config.ts's `rollupOptions.input`:
      its saves need the dev-only `/__nd` endpoints, so a deployed copy would be
      read-only. Open http://localhost:5173/FastShaders/node-editor.html under
      `npm run dev`; on the deployed site the SPA fallback answers this URL with
      the main editor, not a 404.
    -->
    <!--
      Stamp the persisted theme before first paint so a dark-mode session doesn't
      flash light while the JS/CSS bundle loads. The THEME half mirrors
      index.html — the store re-applies data-theme on init and on every toggle,
      and the inline background mirrors tokens.css --bg-app so the pre-CSS frame
      matches too. index.html additionally stamps `lang` from fs:lang; this page
      deliberately does not, being an English-only localhost tool.
    -->
    <script>
      try {
        var dark = localStorage.getItem('fs:codeEditorTheme') === 'vs-dark';
        var el = document.documentElement;
        el.setAttribute('data-theme', dark ? 'dark' : 'light');
        el.style.background = dark ? '#17181b' : '#F5F5F5';
      } catch (e) { /* private mode / storage disabled — default light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/nodeEditor.tsx"></script>
  </body>
</html>
