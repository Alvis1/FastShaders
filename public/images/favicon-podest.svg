<!--
  Podest mark: the two mirrored P's. Used by podest.html and by the immersive
  VR popup it writes.

  Three notes on how this differs from FastShadersPodest_Ikona.svg as authored:
   • The source carries the FastShaders S+F as well, parked ~747 units to the
     LEFT of its own 522×372 viewBox — the three icons were laid out side by
     side on one canvas (FS at x≈213, Podest at x≈960, SC at x≈1733) and each
     export kept the neighbour's artwork. It never rendered in any browser, so
     it is dropped here rather than shipped as ~2.5 KB of invisible geometry
     that a future re-crop could reveal.
   • The viewBox squares up the drawing (573×573, ink centred with ~5% margin),
     because a favicon is composited into a square box — a 522×372 viewBox
     letterboxes down to roughly 16×11 and reads as a smudge in the tab strip.
   • The P's carry class="ink" and a prefers-color-scheme rule: they are the
     only black shapes in the set, and a favicon is drawn straight onto the
     browser's tab strip, where black-on-dark is an invisible icon.
-->
<svg viewBox="-26 -101 573 573" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <style>
        .ink { fill: #111111; }
        @media (prefers-color-scheme: dark) { .ink { fill: #f2f4f7; } }
    </style>
