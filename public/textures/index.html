<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Copied VERBATIM into dist (public/ is not rewritten by Vite), so every
       reference must stay RELATIVE — favicons.test.ts pins this. Served at
       /FastShaders/textures/ (Pages), /fastshaders/textures/ (alvismisjuns),
       /textures/ (fs.sferas.lv). -->
  <link rel="icon" type="image/svg+xml" href="../images/favicon-app.svg" />
  <title>FastShaders — textures</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Opening FastShaders with the texture library…</p>
  <script>
    // Unlock the content browser's ready-made TEXTURES strip for ONE page
    // load. The tab is hidden by default; this entry is how it is switched on.
    //
    // sessionStorage, never localStorage — the same reasoning /eval spells out
    // (this browser must not stay unlocked for every later visit) — and the
    // app CONSUMES the key at boot (src/utils/texturesUnlock.ts) rather than
    // merely reading it. That destructive read is what makes "any reload turns
    // the textures off again" true: a page cannot tell a hard reload from a
    // soft one (PerformanceNavigationTiming reports 'reload' for both, and
    // sessionStorage survives either), so the app ends the unlock itself
    // instead of asking the browser a question it cannot answer.
    //
    // No launch parameters here, deliberately: /eval carries a task/condition
    // query because a study run has to record which arm it was; this entry is
    // one switch and forwarding a query would only give it a second, unvetted
    // input.
    try {
      sessionStorage.setItem('fs:texturesArm', '1');
    } catch (e) { /* storage blocked — the app just boots with textures hidden */ }
    // '../' and not an absolute path: this page is copied verbatim to four
    // deploy bases (/FastShaders/, /fastshaders/, /, tauri://). Every host
    // 301s the slash-less directory URL to the trailing-slash form, so the
    // relative hop lands on the app — the /eval redirector has been doing
    // exactly this since it shipped.
    location.replace('../');
  </script>
  <noscript>
    <p style="font-family: sans-serif; padding: 0 2rem;">
      JavaScript is required. Open the app at <a href="../">the main page</a>.
    </p>
  </noscript>
</body>
</html>
