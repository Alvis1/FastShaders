    var above = rect.top - 4 - m.height;
    var top = (below + m.height <= window.innerHeight - 4) ? below
            : (above >= 4 ? above : Math.max(4, window.innerHeight - m.height - 4));
    partsMenuEl.style.left = left + "px";
    partsMenuEl.style.top = top + "px";
  }

  function openPartsMenu(rect) {
    // Presentation mode hides it in CSS anyway; not opening it at all also
    // keeps the state honest for the moment the exhibitor comes back out.
    if (!partsAvailable() || presenting()) return;
    renderPartsMenu();
    partsMenuEl.classList.add("show");
    partsBtn.classList.add("active");
    partsBtn.setAttribute("aria-expanded", "true");
    placePartsMenu(rect);
  }

  /** Right-click shortcut: the coordinates come from the SANDBOX — coerce. */
  function openPartsMenuAt(x, y) {
    var px = (typeof x === "number" && isFinite(x)) ? x : window.innerWidth / 2;
    var py = (typeof y === "number" && isFinite(y)) ? y : window.innerHeight / 2;
    px = Math.max(0, Math.min(window.innerWidth, px));
    py = Math.max(0, Math.min(window.innerHeight, py));
    openPartsMenu({ left: px, right: px, top: py, bottom: py });
  }

  partsBtn.addEventListener("click", function () {
    if (partsMenuEl.classList.contains("show")) closePartsMenu();
    else openPartsMenu(partsBtn.getBoundingClientRect());
  });

  document.addEventListener("pointerdown", function (e) {
    if (!partsMenuEl.classList.contains("show")) return;
    if (partsMenuEl.contains(e.target) || partsBtn.contains(e.target)) return;
    closePartsMenu();
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && partsMenuEl.classList.contains("show")) {
      e.stopPropagation();
      closePartsMenu();
    }
  }, true);

  // ── Stage lifecycle: restore, watchdog, restart ─────────────────────
  // Everything below exists for ONE reason: podest is meant to run unattended
  // on a pedestal for weeks. Over that span the stage WILL be interrupted (a
  // GPU driver reset, a compositor hiccup, a display sleep) and three's
  // `time` uniform — a float32 accumulating seconds since boot — degrades on
  // its own: 7.8 ms of quantization after a day, 62 ms after a week, a quarter
  // of a second after a month, at which point every animation is a slideshow.
  // A stage restart fixes both, and it is cheap because the parent owns all
  // the state.
  var STAGE_BEAT_MS = 5000;          // heartbeat interval inside the stage
  var STAGE_STALL_MS = 30000;        // no progress for this long ⇒ restart
  var STAGE_MIN_RESTART_MS = 30000;  // never thrash restarts
  var STAGE_GIVE_UP = 6;             // consecutive failed restarts ⇒ back off…
  var STAGE_RETRY_MS = 600000;       // …to one quiet retry every 10 min
  var lastBeat = 0, lastFrameId = -1, lastProgress = 0;
  var lastRestartAt = 0, restartStreak = 0, stageDeadlineTimer = null;

  // Replays everything the parent owns onto a freshly booted stage. This is
  // the whole state — which is why the pending queue is DISCARDED on ready
  // rather than flushed: replaying it too would just re-apply (and recompile)
  // the same shader twice. Uniform values ride along automatically: applying
  // the shader triggers fs:uniforms, and onUniforms re-posts every stored one.
  function applyStateToStage() {
    post({ type: "fs:background", color: state.bgColor });
    post({ type: "fs:spin", playing: state.spinning, dur: spinDur() });
    post({ type: "fs:stats-on", on: state.showStats });
    if (state.geometry !== "sphere") setGeometry(state.geometry);
    if (state.showMaterials) post({ type: "fs:detach-shader" });
    else if (state.shaderSource) post({ type: "fs:shader", source: state.shaderSource });
    // Per-mesh material assignments. Posted here so the replay is complete in
    // one place — but the shader above only finishes importing a moment later,
    // so the assignment that actually LANDS is the one onStageParts re-posts
    // when the stage reports the materials it built. Both are idempotent.
    post({ type: "fs:context-hook", on: partsAvailable() });
    sendPartAssignments();
  }

  function noteStageAlive() {
    lastBeat = Date.now(); lastProgress = lastBeat; lastFrameId = -1;
  }

  // A restart only "counts" as successful once the stage has stayed up for a
  // while, so a machine whose GPU is genuinely broken shows one sticky error
  // instead of reloading the iframe forever.
  function onStageBeat(m) {
    var now = Date.now();
    lastBeat = now;
    var fid = typeof m.frameId === "number" ? m.frameId : -1;
    if (fid !== lastFrameId) { lastFrameId = fid; lastProgress = now; }
    if (restartStreak && now - lastRestartAt > 120000) restartStreak = 0;
    // Fallback for the (unlikely) case where the stage cannot reach three's
    // node frame to wrap `time` itself: restart on its behalf.
    if (m.wrapNeeded) restartStage("time wrap");
  }

  function restartStage(reason) {
    var now = Date.now();
    if (now - lastRestartAt < STAGE_MIN_RESTART_MS) return;
    // Back off hard after a run of failures, but never stop for good: a
    // transient fault (a driver update mid-week, VRAM pressure) must not take
    // the exhibit down until a human walks past. One quiet retry every 10 min.
    if (restartStreak >= STAGE_GIVE_UP) {
      showError("The 3D stage keeps failing to start (" + reason + "). Retrying every 10 minutes; reload to retry now.", false, true);
      if (now - lastRestartAt < STAGE_RETRY_MS) return;
    }
    lastRestartAt = now; restartStreak++;
    stageReady = false; outQueue = [];
    lastBeat = now; lastProgress = now; lastFrameId = -1;
    // A fresh srcdoc navigates the iframe: the old document (and every GPU
    // resource, blob URL and listener it held) is torn down wholesale.
    stage.setAttribute("srcdoc", buildStageDoc());
  }

  // Watchdog. Runs only while the document is VISIBLE — a hidden tab has no
  // rAF, so a frozen frameId there is normal, not a fault.
  function checkStage() {
    // The platform can drop a screen wake lock on its own (a system dialog, a
    // user switching away and back), and in an untouched run nothing else
    // would ever ask for it again. requestWakeLock is idempotent, so riding
    // the watchdog's existing 5 s tick costs nothing and closes that hole.
    requestWakeLock();
    if (document.visibilityState !== "visible") { lastBeat = lastProgress = Date.now(); return; }
    var now = Date.now();
    // Never became ready at all (a boot that died before the bridge ran).
    if (!stageReady) { if (now - lastRestartAt > 45000) restartStage("stage never started"); return; }
    if (now - lastBeat > STAGE_STALL_MS) { restartStage("stage stopped responding"); return; }
    if (now - lastProgress > STAGE_STALL_MS) restartStage("rendering stalled");
  }
  stageDeadlineTimer = setInterval(checkStage, STAGE_BEAT_MS);

  // ── Session persistence (IndexedDB) ─────────────────────────────────
  // A pedestal outlives its browser: auto-update relaunches, power cuts, an OS
  // reboot, a memory-pressure tab discard, or a visitor pressing F5. The
  // loaded shader lives only in JS memory, so any of those leaves a grey
  // sphere until somebody walks over and re-drops the file. Mirroring the last
  // drop into IndexedDB and replaying it at boot is what makes the install
  // unattended. localStorage is the wrong store here — shader modules carry
  // base64 image payloads and models are raw binary, both far past its ~5 MB
  // string budget. Every path is throw-safe: private mode, a blocked upgrade,
  // a quota error or a hung open all degrade to today's session-only
  // behaviour.
  var DB_NAME = "fs-podest", DB_STORE = "session", DB_KEY = "last";
  var MAX_SAVED_SHADER = 24 * 1024 * 1024;  // chars
  var MAX_SAVED_MODEL = 64 * 1024 * 1024;   // bytes — matches the zip inflate cap
  var dbHandle = null, dbWaiters = null, dbSettled = false, restoreDone = false, saveTimer = null;

  function getDb(cb) {
    if (dbSettled) { cb(dbHandle); return; }
    if (dbWaiters) { dbWaiters.push(cb); return; }
    dbWaiters = [cb];
    function settle(db) {
      if (dbSettled) return;
      dbSettled = true; dbHandle = db;
      var q = dbWaiters || []; dbWaiters = null;
      q.forEach(function (f) { try { f(db); } catch (e) {} });
    }
    try {
      if (!window.indexedDB) { settle(null); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { try { req.result.createObjectStore(DB_STORE); } catch (e) {} };
      req.onsuccess = function () { settle(req.result); };
      req.onerror = function () { settle(null); };
      req.onblocked = function () { settle(null); };
      setTimeout(function () { settle(null); }, 5000);  // never hang a boot on a wedged open
    } catch (e) { settle(null); }
  }

  function saveSession() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(writeSession, 400);
  }
  function writeSession() {
    saveTimer = null;
    if (!state.autoRestore) return;
    var rec = {
      shaderSource: (typeof state.shaderSource === "string" && state.shaderSource.length <= MAX_SAVED_SHADER) ? state.shaderSource : null,
      shaderName: state.shaderName || null,
      modelBytes: (state.modelBytes && state.modelBytes.byteLength <= MAX_SAVED_MODEL) ? state.modelBytes : null,
      modelName: state.modelName || null,
      modelKind: state.modelKind || null,
      geometry: state.geometry,
      showMaterials: !!state.showMaterials,
      titleText: state.titleText || "",
      // The exhibitor's tuning IS the artwork — losing it to a reload would
      // silently show the wrong piece. Small plain JSON, unlike the payloads
      // above; onUniforms picks these up as each slider's `current`.
      values: state.values,
    };
    getDb(function (db) {
      if (!db) return;
      try {
        var tx = db.transaction(DB_STORE, "readwrite");
        var os = tx.objectStore(DB_STORE);
        if (!rec.shaderSource && !rec.modelBytes) os.delete(DB_KEY); else os.put(rec, DB_KEY);
        tx.onerror = function () {};   // quota / corruption ⇒ session-only, silently
        tx.onabort = function () {};
      } catch (e) {}
    });
  }
  function clearSession() {
    getDb(function (db) {
      if (!db) return;
      try { db.transaction(DB_STORE, "readwrite").objectStore(DB_STORE).delete(DB_KEY); } catch (e) {}
    });
  }

  function restoreSession() {
    if (!state.autoRestore) return;
    getDb(function (db) {
      if (!db) return;
      try {
        var rq = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
        rq.onsuccess = function () { applyRestored(rq.result); };
        rq.onerror = function () {};
      } catch (e) {}
    });
  }
  // Re-validated on the way back in: the record is ours, but it has sat in a
  // shared-origin store across restarts, and the loaders it feeds treat their
  // input as adversarial anyway.
  function applyRestored(rec) {
    // A file dropped while the async read was in flight always wins.
    if (restoreDone || !rec || typeof rec !== "object") return;
    if (state.shaderSource || state.modelBytes) return;
    restoreDone = true;
    var name = function (n) { return typeof n === "string" ? n.slice(0, 200) : ""; };
    // Read BEFORE loadShaderText: replaying the session re-derives the title
    // from the file name and clears this key, but resuming is not the same as
    // dropping a new file — a name the user typed must survive the reload.
    var customTitle = readStr("fs:viewerTitleText", "");
    if (rec.modelBytes instanceof ArrayBuffer && rec.modelBytes.byteLength > 0 && rec.modelBytes.byteLength <= MAX_SAVED_MODEL) {
      loadModelBuffer(rec.modelBytes, name(rec.modelName) || (rec.modelKind === "obj" ? "model.obj" : "model.glb"));
    }
    if (typeof rec.shaderSource === "string" && rec.shaderSource && rec.shaderSource.length <= MAX_SAVED_SHADER) {
      loadShaderText(rec.shaderSource, name(rec.shaderName) || "shader");
      if (customTitle) {
        state.titleText = customTitle.slice(0, TITLE_MAX);
        writePref("fs:viewerTitleText", state.titleText);
        renderTitle();
      } else if (typeof rec.titleText === "string" && rec.titleText) {
        state.titleText = rec.titleText.slice(0, TITLE_MAX);
        renderTitle();
      }
    }
    // AFTER loadShaderText — which clears state.values on a source change,
    // and would wipe these seeds if they landed first. Safe ordering: the
    // stage reports fs:uniforms via a postMessage round-trip, so values set
    // synchronously here are always in place before onUniforms reads them.
    if (rec.values && typeof rec.values === "object") {
      // Numbers and '#rrggbb' strings only — onUniforms type-checks again, but
      // a stored value reaches postMessage, so keep junk out of it here.
      Object.keys(rec.values).forEach(function (k) {
        var v = rec.values[k];
        if (typeof v === "number" ? isFinite(v) : isHex6(v)) state.values[k] = v;
      });
    }
    if (typeof rec.geometry === "string" && isKnownGeometry(rec.geometry) && rec.geometry !== state.geometry) {
      geoSelect.value = rec.geometry;
      setGeometry(rec.geometry);
    }
    if (rec.showMaterials && !matToggle.hidden && !state.showMaterials) matToggle.click();
  }
  function isKnownGeometry(k) {
    return k === "sphere" || k === "cube" || k === "plane" || k === "teapot" || k === "bunny" ||
      (k === "model" && !!state.modelBytes);
  }

  // ── Geometry / model plumbing (all applied inside the iframe) ────────
  function isObjKey(k) { return k === "teapot" || k === "bunny"; }
  function primAttr(kind) {
    if (kind === "cube") return "primitive: box; width: 1.4; height: 1.4; depth: 1.4; segmentsWidth: 48; segmentsHeight: 48; segmentsDepth: 48";
    if (kind === "plane") return "primitive: plane; width: 2; height: 2; segmentsWidth: 64; segmentsHeight: 64";
    return "primitive: sphere; radius: 1; segmentsWidth: 64; segmentsHeight: 64";
  }
  // Built-in OBJ models are fetched same-origin HERE (always works) and their
  // bytes shipped into the iframe, so the sandbox never needs cross-origin CORS.
  function ensureObjBytes(kind) {
    if (objCache[kind]) return Promise.resolve(objCache[kind]);
    var file = kind === "bunny" ? "stanford-bunny.obj" : "teapot.obj";
    var url = new URL("models/" + file, window.location.href).href;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.arrayBuffer();
    }).then(function (buf) { objCache[kind] = buf; return buf; });
  }

  function setGeometry(kind) {
    state.geometry = kind;
    if (kind === "model" && state.modelBytes) {
      var mk = state.modelKind === "obj" ? "obj" : "gltf";
      post({ type: "fs:model", modelType: mk, bytes: state.modelBytes, regen: mk === "obj", rotation: ROTATIONS[kind] });
    } else if (isObjKey(kind)) {
      ensureObjBytes(kind)
        .then(function (buf) { post({ type: "fs:model", modelType: "obj", bytes: buf, regen: true, rotation: ROTATIONS[kind] }); })
        .catch(function (e) { showError("Could not load " + kind + ": " + e.message); });
    } else {
      post({ type: "fs:geometry", geometryAttr: primAttr(kind), rotation: ROTATIONS[kind] });
    }
  }

  // ── Shader / model loading ──────────────────────────────────────────
  function loadShaderText(text, name) {
    // A DIFFERENT shader must not inherit tuning stored under colliding
    // auto-generated names: every FastShaders export calls its uniforms
    // property1/color1/…, so in a folder of independent exports the
    // collision is the NORM, and a stored value silently replaces the new
    // artwork's authored default — podest's copy of the editor's
    // uniform-precedence trap, made systematic by the Cycle feature. A
    // re-load of the SAME source keeps the exhibitor's tuning, and stage
    // restarts never pass through here at all (applyStateToStage reposts
    // fs:shader directly). applyRestored seeds the session record's values
    // AFTER this call for the same reason.
    if (typeof text === "string" && text !== state.shaderSource) state.values = {};
    // A drop never arms and always disarms. Doing it HERE too (not only in
    // the fs:uniforms branch) covers a shader that fails to apply and so
    // never reports uniforms at all — otherwise the mic would stay live,
    // driving names from the shader that is no longer loaded.
    micReset([]);
    clearError();
    state.shaderSource = text;
    // Display name only — drop the .js/.mjs/.tsl extension from the panel.
    // Extension-only names (a file literally called ".js") strip to "", so
    // fall back to the raw name rather than hiding the row.
    var displayName = name ? String(name).replace(/\.[^./\\]+$/, "") : "";
    state.shaderName = displayName || (name ? String(name) : "shader");
    setTitleFromFile(name);
    state.showMaterials = false;
    matToggle.classList.remove("active");
    matToggle.textContent = "Show model materials";
    post({ type: "fs:shader", source: text });
    updateLoaded();
    saveSession();
  }

  function loadModelBuffer(buf, name) {
    // A clip index means nothing across models, and neither does a playhead.
    state.animClip = 0;
    animTime = 0;
    // Normalize to a standalone ArrayBuffer so it survives structured-clone
    // messaging regardless of whether the source was a File or a zip slice.
    var ab = buf instanceof ArrayBuffer ? buf : buf.buffer.slice(buf.byteOffset, buf.byteOffset + buf.byteLength);
    state.modelBytes = ab;
    // A dropped OBJ takes the obj-model + regen path (normals/UVs rebuilt —
    // OBJLoader output is non-indexed, same as the built-in teapot/bunny);
    // glb/gltf keep their authored data (regen:false).
    state.modelKind = extOf(name || "") === "obj" ? "obj" : "gltf";
    state.modelName = name || "model.glb";
    if (!geoSelect.querySelector('option[value="model"]')) {
      var opt = document.createElement("option");
      opt.value = "model"; opt.textContent = "Loaded model";
      geoSelect.appendChild(opt);
    }
    geoSelect.value = "model";
    matToggle.hidden = false;
    setGeometry("model");
    updateLoaded();
    saveSession();
  }

  // ── Uniform sliders ─────────────────────────────────────────────────
  function guessBounds(def) {
    var d = Number(def) || 0, min = 0, max = 1;
    if (d < 0) { min = Math.min(-1, d * 2); max = Math.max(1, -d); }
    else if (d > 1) { max = d * 2; }
    if (min === max) { min = d - 1; max = d + 1; }
    return { min: min, max: max };
  }

  // Called with the iframe-reported { name: defaultValue } map after each apply.
  function onUniforms(map) {
    uniformsEl.innerHTML = "";
    var names = Object.keys(map);
    if (!names.length) {
      uniformsEl.innerHTML = state.shaderSource
        ? '<div class="empty">This shader exposes no adjustable properties.</div>'
        : '<div class="empty">Load a shader to expose its properties.</div>';
      return;
    }
    names.forEach(function (name) {
      // Colour uniform (reported as '#rrggbb'): a picker row — bounds/slider
      // are meaningless for a colour.
      if (typeof map[name] === "string") {
        var cDef = /^#[0-9a-fA-F]{6}$/.test(map[name]) ? map[name] : "#ffffff";
        var cCur = Object.prototype.hasOwnProperty.call(state.values, name) && typeof state.values[name] === "string"
          ? state.values[name] : cDef;
        state.values[name] = cCur;
        var cRow = document.createElement("div");
        cRow.className = "u-row";
        cRow.innerHTML =
          '<div class="u-head"><span class="u-name" title="' + esc(name) + '">' + esc(name) + '</span>' +
          '<input class="u-color" type="color" /></div>';
        var cInput = cRow.querySelector(".u-color");
        cInput.value = cCur;
        cInput.addEventListener("input", function () {
          state.values[name] = cInput.value;
          saveSession();
          post({ type: "fs:uniform", name: name, value: cInput.value });
        });
        post({ type: "fs:uniform", name: name, value: cCur });
        uniformsEl.appendChild(cRow);
        return;
      }
      var def = typeof map[name] === "number" ? map[name] : 0;
      // hasOwnProperty guards: a uniform named 'constructor'/'toString'/etc.
      // must not resolve to an inherited Object.prototype member (which would
      // throw DataCloneError when postMessage'd and abort the whole forEach).
      var current = Object.prototype.hasOwnProperty.call(state.values, name) && typeof state.values[name] === "number"
        ? state.values[name] : def;
      state.values[name] = current;
      var b = (Object.prototype.hasOwnProperty.call(state.bounds, name) && state.bounds[name]) || guessBounds(def);
      state.bounds[name] = b;

      var row = document.createElement("div");
      row.className = "u-row";
      row.innerHTML =
        '<div class="u-head"><span class="u-name" title="' + esc(name) + '">' + esc(name) + '</span>' +
        '<input class="u-val" type="number" step="any" /></div>' +
        '<input class="u-slider" type="range" />' +
        '<div class="u-bounds"><input class="u-min" type="number" step="any" /><span>min · max</span><input class="u-max" type="number" step="any" /></div>';

      var valInput = row.querySelector(".u-val");
      var slider = row.querySelector(".u-slider");
      var minInput = row.querySelector(".u-min");
      var maxInput = row.querySelector(".u-max");

      function syncRange() { slider.min = b.min; slider.max = b.max; slider.step = ((b.max - b.min) / 200) || 0.001; }
      function setValue(v, fromSlider) {
        if (isNaN(v)) return;
        state.values[name] = v;
        saveSession();   // debounced — a scrub writes once, not per frame
        post({ type: "fs:uniform", name: name, value: v });
        valInput.value = Number(v.toFixed(4));
        if (!fromSlider) slider.value = v;
      }
      syncRange();
      minInput.value = b.min; maxInput.value = b.max;
      slider.value = current;
      valInput.value = Number(current.toFixed ? current.toFixed(4) : current);
      // Push the restored/current value into the freshly-applied shader.
      post({ type: "fs:uniform", name: name, value: current });

      slider.addEventListener("input", function () { setValue(parseFloat(slider.value), true); });
      valInput.addEventListener("change", function () { setValue(parseFloat(valInput.value), false); });
      minInput.addEventListener("change", function () {
        var m = parseFloat(minInput.value); if (isNaN(m)) return;
        b.min = m; state.bounds[name] = b; saveBounds(); syncRange(); slider.value = state.values[name];
      });
      maxInput.addEventListener("change", function () {
        var m = parseFloat(maxInput.value); if (isNaN(m)) return;
        b.max = m; state.bounds[name] = b; saveBounds(); syncRange(); slider.value = state.values[name];
      });

      uniformsEl.appendChild(row);
    });
  }

  // ── Title overlay ───────────────────────────────────────────────────
  // A presentation label for pedestal use. The name is derived from the
  // dropped file (extension dropped, "_" read as a space) and can be typed
  // over; the typed one wins until the next shader is dropped. It is only
  // ever written with textContent — the file name comes from a shared
  // archive and the stored override comes from localStorage, so neither may
  // reach innerHTML on this trusted top document.
  function prettyName(name) {
    var base = String(name).split(/[\\/]/).pop().replace(/\.[^.]+$/, "");
    var pretty = base.replace(/_+/g, " ").replace(/\s+/g, " ").trim();
    return (pretty || base).slice(0, TITLE_MAX);
  }
  function setTitleFromFile(name) {
    // A drop that lands mid-edit discards the half-typed name rather than
    // letting a later commit overwrite the file's own name.
    closeTitleEditor();
    state.titleText = name ? prettyName(name) : "";
    writePref("fs:viewerTitleText", "");  // auto names don't outlive the shader
    renderTitle();
  }
  function renderTitle() {
    var empty = !state.titleText;
    titleBar.classList.toggle("show", state.titleShow);
    titleTextEl.textContent = empty ? "Click to name this shader" : state.titleText;
    titleTextEl.classList.toggle("is-placeholder", empty);
    titleTextEl.style.color = state.titleColor;
    if (!state.titleShow) closeTitleEditor();
  }

  var titleBeforeEdit = "";
  function titleEditorOpen() { return titleEditor.classList.contains("show"); }
  function openTitleEditor() {
    titleBeforeEdit = state.titleText;
    titleInput.value = state.titleText;
    titleColorEl.value = state.titleColor;
    titleEditor.classList.add("show");
    titleInput.focus();
    titleInput.select();
  }
  function closeTitleEditor() { titleEditor.classList.remove("show"); }
  // Committing normalizes whitespace (typing stays untouched, so a trailing
  // space isn't eaten mid-word) and persists — an empty name means "no title",
  // not "fall back to the file name".
  function commitTitle() {
    if (!titleEditorOpen()) return;
    state.titleText = String(titleInput.value).replace(/\s+/g, " ").trim().slice(0, TITLE_MAX);
    writePref("fs:viewerTitleText", state.titleText);
    closeTitleEditor();
    renderTitle();
    saveSession();
  }

  titleTextEl.addEventListener("click", function () {
    if (titleEditorOpen()) commitTitle(); else openTitleEditor();
  });
  titleTextEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTitleEditor(); }
  });
  titleInput.addEventListener("input", function () {
    state.titleText = titleInput.value.slice(0, TITLE_MAX);
    renderTitle();
  });
  titleInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); commitTitle(); }
    else if (e.key === "Escape") { state.titleText = titleBeforeEdit; closeTitleEditor(); renderTitle(); }
  });
  titleColorEl.addEventListener("input", function () {
    if (!isHex6(titleColorEl.value)) return;
    state.titleColor = titleColorEl.value;
    writePref("fs:viewerTitleColor", state.titleColor);
    renderTitle();
  });
  // Anything outside the title column commits and closes. Capture phase so a
  // click on a panel control still lands on that control. Presses inside the
  // stage iframe never reach here — they arrive as a forwarded fs:activity.
  window.addEventListener("pointerdown", function (e) {
    if (titleEditorOpen() && !titleBar.contains(e.target)) commitTitle();
  }, true);

  titleToggle.checked = state.titleShow;
  titleToggle.addEventListener("change", function () {
    state.titleShow = titleToggle.checked;
    writePref("fs:viewerTitleShow", state.titleShow ? "1" : "0");
    renderTitle();
  });

  // ── Unattended-run options ──────────────────────────────────────────
  var restoreToggle = document.getElementById("restore-toggle");
  var viewReturnToggle = document.getElementById("viewreturn-toggle");
  restoreToggle.checked = state.autoRestore;
  restoreToggle.addEventListener("change", function () {
    state.autoRestore = restoreToggle.checked;
    writePref("fs:viewerAutoRestore", state.autoRestore ? "1" : "0");
    if (state.autoRestore) saveSession(); else clearSession();
  });
  viewReturnToggle.checked = state.viewReturn;
  viewReturnToggle.addEventListener("change", function () {
    state.viewReturn = viewReturnToggle.checked;
    writePref("fs:viewerViewReturn", state.viewReturn ? "1" : "0");
    armViewReturn();
  });

  // ── Fullscreen ──────────────────────────────────────────────────────
  // The whole top document goes fullscreen (not the sandboxed iframe), so the
  // title overlay and the drop plumbing keep working; `is-fs` on <html> is
  // what strips the chrome. Safari still needs the webkit-prefixed names.
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  // Presentation mode is deliberately WIDER than the Fullscreen API. Fullscreen
  // can only be entered from a user gesture, and an unattended pedestal has
  // nobody to give one after a browser auto-update or a power blip — it would
  // come back windowed, with the panel over the artwork and, far worse, no
  // screen wake lock, so the display blanks at the OS idle timeout and stays
  // black for the rest of the week. So the mode is remembered: pressing ⛶ once
  // at install survives every restart, and `?present=1` pins it for a kiosk
  // launcher. Everything that must keep working while presenting — the wake
  // lock, the idle view return, the chrome-hiding class — asks presenting(),
  // never fsElement(); only the ⛶ button's own glyph and auto-fade read the
  // real window state, because in windowed presentation that button is the way
  // back into fullscreen.
  var presentParam = /[?&]present=1/.test(location.search);
  function presenting() { return !!fsElement() || presentParam || state.presenting; }
  function syncPresentClass() {
    docEl.classList.toggle("is-present", presenting());
    // The CSS rule hides it, but leaving `.show` set would spring the menu
    // back open the moment the exhibitor left presentation mode.
    if (presenting()) closePartsMenu();
  }
  function toggleFullscreen() {
    try {
      if (fsElement()) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) { var pe = exit.call(document); if (pe && pe.catch) pe.catch(function () {}); }
        return;
      }
      var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
      if (!req) { showError("Fullscreen is not available in this browser."); return; }
      var pr = req.call(docEl);
      if (pr && pr.catch) pr.catch(function (err) { showError("Could not enter fullscreen: " + (err && err.message ? err.message : err)); });
    } catch (e) { showError("Could not toggle fullscreen: " + e.message); }
  }
  // In fullscreen the button itself is chrome: it fades out and comes back on
  // any pointer activity. Re-arming is throttled so an orbit drag (a
  // pointermove flood, forwarded from the stage) doesn't churn timers.
  // Idle view return: a visitor spins the model and walks away, and without
  // this the artwork stays wrongly framed until someone notices — the panel's
  // "Reset view" is hidden in fullscreen, so there is nothing to press.
  // Entering fullscreen pins the CURRENT framing as the one to come back to
  // (fs:save-view), so the exhibitor's composition is what returns, not the
  // boot camera.
  var VIEW_RETURN_MS = 90000;
  var viewTimer = null;
  function armViewReturn() {
    if (viewTimer) { clearTimeout(viewTimer); viewTimer = null; }
    if (!state.viewReturn || !presenting()) return;
    viewTimer = setTimeout(function () {
      viewTimer = null;
      post({ type: "fs:reset-camera" });
    }, VIEW_RETURN_MS);
  }

  var idleTimer = null, lastBump = 0;
  function bumpActivity() {
    if (!presenting()) return;
    armViewReturn();
    var t = Date.now();
    if (docEl.classList.contains("is-active") && t - lastBump < 400) return;
    lastBump = t;
    docEl.classList.add("is-active");
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { idleTimer = null; docEl.classList.remove("is-active"); }, 2600);
  }
  // Screen wake lock — a pedestal display must not blank after 10 minutes.
  // Tied to fullscreen: entering is a user gesture (which every implementation
  // accepts) and it keeps a laptop that is merely *browsing* podest from having
  // its screensaver suppressed. The platform drops the lock whenever the
  // document is hidden, so it is re-acquired on visibilitychange. No API
  // (Firefox < 126, Safari < 16.4) is a silent no-op.
  var wakeLock = null;
  function requestWakeLock() {
    if (!navigator.wakeLock || wakeLock || document.visibilityState !== "visible") return;
    if (!presenting()) return;
    try {
      navigator.wakeLock.request("screen").then(function (lock) {
        // Leaving presentation mode mid-request must not strand the lock.
        // NB presenting(), not fsElement() — with the windowed presentation
        // mode above, gating on fullscreen would release every lock the
        // instant its promise resolved and quietly undo the whole fix.
        if (!presenting()) { try { lock.release(); } catch (e) {} return; }
        wakeLock = lock;
        lock.addEventListener("release", function () { if (wakeLock === lock) wakeLock = null; });
      }, function () {});
    } catch (e) {}
  }
  function releaseWakeLock() {
    var lock = wakeLock; wakeLock = null;
    if (!lock) return;
    try { var p = lock.release(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  function onFullscreenChange() {
    var on = !!fsElement();
    docEl.classList.toggle("is-fs", on);
    // Entering ⛶ arms presentation mode for good; leaving it disarms — which
    // is also the only way back to the chrome after a reload came up
    // presenting (press ⛶, then Esc).
    state.presenting = on;
    writePref("fs:viewerPresenting", on ? "1" : "0");
    syncPresentClass();
    fsBtn.textContent = on ? "⤡" : "⛶";
    fsBtn.title = on ? "Exit fullscreen (Esc)" : "Fullscreen";
    fsBtn.setAttribute("aria-label", fsBtn.title);
    // On a headset the panel button is the VR entry — its label must not be
    // clobbered back to Fullscreen by a fullscreen transition.
    if (!vrSupported) fsPanelBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
    if (on) {
      commitTitle();                    // no-ops when the editor is closed
      post({ type: "fs:save-view" });   // this framing is what the idle return restores
      bumpActivity();
      requestWakeLock();
    } else {
      docEl.classList.remove("is-active");
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
      if (viewTimer) { clearTimeout(viewTimer); viewTimer = null; }
      releaseWakeLock();
    }
  }
  fsBtn.addEventListener("click", toggleFullscreen);
  // The panel's labelled twin. It is only ever reachable while NOT presenting
  // (presentation mode hides the panel), so it always reads "Fullscreen" —
  // but it is kept in sync anyway rather than relying on that. On a
  // confirmed headset it is the VR entry instead (see the Immersive VR
  // section below; openVR is hoisted, vrSupported is read at click time).
  fsPanelBtn.addEventListener("click", function () { if (vrSupported) openVR(); else toggleFullscreen(); });
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);
  window.addEventListener("pointermove", bumpActivity, { passive: true });
  window.addEventListener("pointerdown", bumpActivity, { passive: true });
  window.addEventListener("keydown", bumpActivity);

  function showMaterialsMessage() {
    uniformsEl.innerHTML = '<div class="empty">Model materials shown — switch to the shader to tune properties.</div>';
  }

  function updateLoaded() {
    var rows = [];
    if (state.shaderName) rows.push('<div class="row"><span>Shader:</span><span class="name" title="' + esc(state.shaderName) + '">' + esc(state.shaderName) + "</span></div>");
    if (state.modelName) rows.push('<div class="row"><span>Model:</span><span class="name" title="' + esc(state.modelName) + '">' + esc(state.modelName) + "</span></div>");
    loadedEl.innerHTML = rows.join("");
    loadedEl.hidden = rows.length === 0;
  }

  // ── File dispatch ───────────────────────────────────────────────────
  function extOf(name) { var i = name.lastIndexOf("."); return i < 0 ? "" : name.slice(i + 1).toLowerCase(); }
  function isShaderName(n) { var e = extOf(n); return e === "js" || e === "mjs" || e === "tsl" || e === "txt"; }
  function isModelName(n) { var e = extOf(n); return e === "glb" || e === "gltf" || e === "obj"; }
  function junkName(n) { var base = n.split("/").pop(); return n.indexOf("__MACOSX") !== -1 || base.charAt(0) === "."; }

  // Monotonic guard for the ASYNC work-folder loads (a multi-second zip
  // inflate, a cloud-hydrated getFile): a load that resolves late must not
  // clobber a newer pick or a fresh drop — the same race the mic arm/disarm
  // token closes. Every direct user load bumps it (handleFiles), every
  // work-entry load carries its own value and bails when superseded. Plain
  // drops themselves stay unguarded, as before.
  var loadSeq = 0;

  function handleFiles(files) {
    loadSeq++;   // a drop/pick supersedes any still-inflight folder load
    var list = Array.prototype.slice.call(files);
    var zip = list.find(function (f) { return extOf(f.name) === "zip"; });
    if (zip) { handleZip(zip); return; }
    var shader = list.find(function (f) { return isShaderName(f.name); });
    var model = list.find(function (f) { return isModelName(f.name); });
    if (model) model.arrayBuffer().then(function (buf) { loadModelBuffer(buf, model.name); }).catch(function (e) { showError("Could not read file: " + e.message); });
    if (shader) shader.text().then(function (t) { loadShaderText(t, shader.name); }).catch(function (e) { showError("Could not read file: " + e.message); });
    if (!shader && !model) showError("Unrecognized file. Drop a shader (.js/.tsl), a model (.glb/.gltf/.obj), or a .zip.");
  }

  // seq (optional) is a work-folder load's generation — stale inflates bail
  // instead of committing over a newer pick. Drops pass no seq (immediate).
  function handleZip(file, seq) {
    clearError();
    file.arrayBuffer().then(unzip).then(function (entries) {
      if (seq !== undefined && seq !== loadSeq) return;
      var usable = entries.filter(function (e) { return !junkName(e.name); });
      var shader = usable.find(function (e) { return isShaderName(e.name); });
      var model = usable.find(function (e) { return isModelName(e.name); });
      if (model) loadModelBuffer(model.data, model.name.split("/").pop());
      if (shader) loadShaderText(new TextDecoder().decode(shader.data), shader.name.split("/").pop());
      if (!shader && !model) showError("Zip contained no shader (.js/.tsl) or model (.glb/.gltf/.obj).");
    }).catch(function (e) { showError("Could not read zip: " + e.message); });
  }

  // Adversarial-input caps — mirror src/utils/zipReader.ts so a shared archive
  // can't balloon memory (decompression bomb) or slip in a blank shader.
  var MAX_ENTRIES = 512;
  var MAX_TOTAL_UNCOMPRESSED = 64 * 1024 * 1024; // 64 MB across all entries
  var MAX_NAME_LENGTH = 512;

  // Minimal in-browser unzip: parse the ZIP central directory and inflate
  // deflate entries with the native DecompressionStream (no dependency).
  // Entries are inflated SEQUENTIALLY and the running total is checked against
  // ACTUAL inflated bytes, so a bomb aborts before every entry balloons —
  // declared sizes are never trusted.
  async function unzip(buf) {
    var dv = new DataView(buf), bytes = new Uint8Array(buf), eocd = -1;
    for (var i = buf.byteLength - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
    if (eocd < 0) throw new Error("not a zip archive");
    var count = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true);
    if (count > MAX_ENTRIES) throw new Error("too many entries (" + count + ")");
    var entries = [], totalInflated = 0;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var compSize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var localOff = dv.getUint32(p + 42, true);
      if (nameLen > MAX_NAME_LENGTH) throw new Error("entry name too long");
      var name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
      var lhNameLen = dv.getUint16(localOff + 26, true);
      var lhExtraLen = dv.getUint16(localOff + 28, true);
      var dataStart = localOff + 30 + lhNameLen + lhExtraLen;
      var comp = bytes.subarray(dataStart, dataStart + compSize);
      p += 46 + nameLen + extraLen + commentLen;
      if (name.endsWith("/")) continue;
      var entry = await inflateEntry(name, method, comp, MAX_TOTAL_UNCOMPRESSED - totalInflated);
      totalInflated += entry.data.length;
      entries.push(entry);
    }
    return entries;
  }
  function inflateEntry(name, method, comp, maxBytes) {
    if (method === 0) {
      if (comp.length > maxBytes) return Promise.reject(new Error("archive too large"));
      return Promise.resolve({ name: name, data: comp.slice() });
    }
    if (method !== 8) return Promise.reject(new Error("unsupported compression method " + method));
    // Read the inflate stream in chunks and abort the moment the OUTPUT exceeds
    // the remaining budget — a single bomb entry can't fully materialize first.
    var reader = new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
    var chunks = [], total = 0;
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) {
          var out = new Uint8Array(total), off = 0;
          for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
          return { name: name, data: out };
        }
        total += r.value.length;
        if (total > maxBytes) return reader.cancel().then(function () { throw new Error("archive too large"); });
        chunks.push(r.value);
        return pump();
      });
    }
    return pump();
  }

  // ── Wiring: drag/drop, file picker, controls ────────────────────────
  // Files drop ANYWHERE. Two regions feed the same handler: parent-owned
  // chrome (the panel) via these window listeners, and the full-screen stage
  // iframe — whose own document swallows drag/drop, so it forwards them over
  // postMessage (fs:drag / fs:dropped, handled above). The overlay shows while
  // EITHER region reports an active drag; refreshOverlay merges both signals
  // and arms a safety timeout so an aborted drag (Esc, or a drop outside the
  // window, which fires no reliable leave event) can never strand the veil up:
  // a live drag keeps re-arming it (panel dragover + the iframe's dragover
  // heartbeat), so it only fires once the drag has genuinely stopped.

  function refreshOverlay() {
    var show = dragDepth > 0 || iframeDrag;

  var fileInput = document.getElementById("file-input");
  document.getElementById("dropzone").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { if (fileInput.files.length) handleFiles(fileInput.files); fileInput.value = ""; });

  geoSelect.addEventListener("change", function () { setGeometry(geoSelect.value); saveSession(); });

  matToggle.addEventListener("click", function () {
    state.showMaterials = !state.showMaterials;
    saveSession();
    if (state.showMaterials) {

  // Spin + its speed. The slider is REVEALED by the button rather than living

  });
  spinSpeedEl.addEventListener("input", function () {

  // ── FPS / frame-time readout ────────────────────────────────────────
  // The stage owns the render loop, so it does the measuring and posts
  // fs:stats ~4×/s; the parent only draws. Enabling is a MESSAGE (replayed by

  // second for weeks of a readout nobody switched on.
  var statsToggle = document.getElementById("stats-toggle");
  function paintStats(fps, ms) {
    var f = typeof fps === "number" && isFinite(fps) ? Math.min(9999, Math.max(0, fps)) : 0;
    var t = typeof ms === "number" && isFinite(ms) ? Math.min(9999, Math.max(0, ms)) : 0;
    statsEl.textContent = Math.round(f) + " FPS · " + t.toFixed(1) + " ms";
  }

    // before the first report arrives (~250 ms).
    if (!state.showStats) statsEl.textContent = "";
    else if (!statsEl.textContent) statsEl.textContent = "— FPS · — ms";
    post({ type: "fs:stats-on", on: state.showStats });
  }
  statsToggle.checked = state.showStats;
  statsToggle.addEventListener("change", function () {
    state.showStats = statsToggle.checked;
    writePref("fs:viewerStats", state.showStats ? "1" : "0");
    applyStats();

  // Background color — an <input type=color> only ever yields #rrggbb, but
  // validate before it crosses into the iframe's attribute string anyway.
  var bgColorEl = document.getElementById("bg-color");
  bgColorEl.value = state.bgColor;
  bgColorEl.addEventListener("input", function () {
    var c = bgColorEl.value;

  var panel = document.getElementById("panel");
  document.getElementById("panel-head").addEventListener("click", function () {
    var collapsed = panel.classList.toggle("collapsed");
    document.getElementById("panel-collapse").textContent = collapsed ? "▸" : "▾";

  // ── Work folder: browse a folder of exports, cycle through them ─────
  // A pedestal usually shows a COLLECTION. The button scans a user-picked
  // folder for shader exports (.js/.mjs/.tsl and .zip bundles — NOT .txt,
  // which the drop path accepts but a folder scan would misread as notes)
  // and lists them in a dropdown; Cycle shows each in turn on a timer,
  // optionally shuffled. Entries load through the exact same handleFiles
  // path as a drop, so zips, models inside zips, mic disarm and session
  // persistence all behave identically.
  //
  // Picking: File System Access API where it exists (Chromium), else a
  // webkitdirectory <input>. Handles are kept only in memory — persisting
  // them to IndexedDB would still need a permission re-grant gesture at
  // every boot — so after a reload the folder must be re-picked; the last
  // SHOWN shader still auto-restores via the session record. The scan is
  // bounded (depth ≤ 3, ≤ 512 files) and skips junk (dotfiles, __MACOSX).
  var workList = [];   // [{ name, file: File|null, handle: FileSystemFileHandle|null }]
  var workBtn = document.getElementById("work-btn");
  var workInput = document.getElementById("work-input");
  var workSection = document.getElementById("work-section");
  var workSelect = document.getElementById("work-select");
  var cycleToggle = document.getElementById("cycle-toggle");
  var cycleShuffle = document.getElementById("cycle-shuffle");

  function openVR() {

    // confirm's modal pause risks the blocker, and a blank window closed on
    // decline is the cheaper failure.
    var w = window.open("", "_blank");
    if (!w) { showError("The browser blocked the VR window. Allow popups for this site and try again."); return; }
    // Sever the popup's live handle on this document BEFORE any untrusted
    // bytes reach it: the popup is same-origin, so the shader could
    // otherwise script and navigate the RUNNING pedestal page through
    // window.opener (kill the watchdogs, forge drops). Origin-wide storage
    // access is the documented residual this cannot remove; our own `w`
    // handle keeps working for the document.write below.
    try { w.opener = null; } catch (e) {}

    // sandbox: a baked shader (skipped in show-model-materials mode, where
    // buildXrDoc bakes none) or a dropped model (parsed by the loaders at
    // this page's real origin). Built-in geometry with no shader is all
    // trusted code — no prompt.

    //     as well.

    //     these counters prove the loop ran, not that pixels landed.
    L.push('  var TWO_PI=Math.PI*2,TIME_WRAP=TWO_PI*2520,BEAT_MS=' + STAGE_BEAT_MS + ',beatTimer=null,rafCount=0,wrapBase=Date.now();');
