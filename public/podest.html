<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Podest</title>
<!-- The Podest mark. RELATIVE, not root-absolute: this file lives in public/
     and ships verbatim (Vite never rewrites it), so it has to resolve itself
     under all four deploy bases — /FastShaders/, /fastshaders/, the desktop
     shell's /, and a bare file open. It sits beside podest.html in every one
     of them. Having an icon at all also kills the automatic /favicon.ico 404:
     podest runs unattended for weeks and rate-limits its own error relay, so a
     permanent spurious console error would make a genuine one harder to spot. -->
<link rel="icon" type="image/svg+xml" href="images/favicon-podest.svg" />
<!--
  Podest — standalone full-screen TSL shader viewer.

  Drag-and-drop:
    • Shader script (.js / .mjs / .tsl) — a FastShaders export OR any TSL ES
      module that `export default`s a Fn and imports from 'three/tsl'. Its
      property uniforms become live sliders (auto-detected by the shaderloader).
    • 3D model (.glb / .gltf / .obj) — becomes the mesh the shader runs on; a toggle
      switches between the shader and the model's own PBR materials.
    • Archive (.zip) — unzipped in-browser (native DecompressionStream, no
      dependency); the first shader script + first model inside are loaded.

  Work folder + cycle (exhibition playlist):
    • The kiosk-sized "Work folder…" button under the header scans a picked
      folder (File System Access API where present, else a webkitdirectory
      input) for shader exports (.js/.mjs/.tsl and .zip bundles) and lists
      them in a dropdown; Cycle shows each in turn — Shuffle randomizes the
      order, the seconds field sets each shader's stay (both persisted).
      Folder access cannot survive a reload (re-granting needs a fresh user
      gesture), so the folder must be re-picked after one; the last SHOWN
      shader still auto-restores via the session record. Garbage control:
      the NEXT entry is picked at arm time and prefetched (hydrates +
      cache-warms the file), and every 40th swap restarts the disposable
      stage — each swap's dynamic import stays in the module registry
      forever (measured ~50 KB/swap, unbounded), so the restart IS the
      garbage collector.

  Immersive VR (headsets):
    • When immersive-vr support is CONFIRMED (isSessionSupported — never a
      UA sniff) the panel's green button reads "Enter VR" and opens a
      top-level popup at this page's real origin: WebXR cannot start inside
      the sandboxed stage (see the Immersive VR section in the script). The
      popup bakes the current state (shader, model, geometry, spin,
      background, tuned uniform values), forces the WebGL2/GLSL backend
      (three r184's WebGPU backend cannot do XR), auto-enters the session
      and keeps an in-document "Enter VR" gate as the gesture fallback.
      Running a DROPPED file outside the sandbox is a trust decision, so a
      confirm names it before the popup gets the shader. The floating ⛶
      keeps its fullscreen meaning — it is the presentation-mode escape
      hatch ("press ⛶, then Esc").
    • Once inside, `vr-nav` owns where the visitor stands: it steps the
      camera rig back so the artwork is framed rather than worn (local-floor
      would otherwise start them inside a 1.6-unit mesh), teleports on the
      controller trigger / hand pinch OR on a Quest-style fist-with-thumb
      button classified from the raw joint poses, clamps every target into a
      1.2–30 m ring around the piece, and walks a stranded visitor back
      after 90 s of a motionless headset. See pushVrNav; the maths is pinned
      by src/podestVrNav.test.ts.

  Presentation mode (pedestal / exhibition use):
    • ⛶ bottom-right (⤡ to leave) hides ALL chrome — panel, drop hint and the
      error banner go away, and the button itself fades out until the next
      pointer movement (including movement inside the stage iframe, which
      forwards an fs:activity heartbeat).
    • The mode is REMEMBERED and outlives the Fullscreen API, which can only
      be entered from a user gesture: after a reload the page comes back
      presenting (chrome hidden, wake lock held) even though the window is no
      longer fullscreen. `?present=1` pins it for a kiosk launcher. To leave a
      remembered mode: press ⛶, then Esc.
    • An optional title, centred at the top, survives into presentation mode:
      it is the dropped file's name minus the extension with "_" read as a
      space, and clicking it opens a small editor for the text and its colour.
      Toggled from the panel; text/colour/toggle persist in localStorage.

  UNATTENDED (pedestal) OPERATION — this page is expected to run for WEEKS with
  nobody touching it, which needs more than "the page works":
    • The stage iframe is DISPOSABLE. Everything it shows is re-derivable from
      `state`, so applyStateToStage() replays it on every fs:ready and the
      stage can be rebuilt at will.
    • three's `time` is a float32 counting seconds since boot; its resolution
      decays as it grows (7.8 ms/day, 62 ms/week, 250 ms/month). The stage
      folds it back every ~4.5 h by an exact multiple of 2π, so sin/cos-driven
      motion crosses the fold seamlessly and the quantum stays under ~1 ms.
    • WebGPU device loss and WebGL context loss are terminal and LOOK like a
      still artwork. Both are reported, plus a 5 s heartbeat carrying the
      renderer's frame counter so a silent stall is caught too; the parent
      rebuilds the stage (floored at 30 s apart; after 6 in a row it backs off
      to one quiet retry every 10 min — never gives up for good, because a
      transient driver fault must not end the exhibit).
    • The last drop — shader, model, geometry AND the exhibitor's tuned
      uniform values — is mirrored into IndexedDB and replayed at boot, so an
      auto-update relaunch or power blip doesn't leave a grey sphere or the
      wrong tuning.
    • Presentation mode takes a screen wake lock, re-asked on every watchdog
      tick (the platform can drop it, and a UA may refuse it until it can
      grant it), and 90 s of idle returns the camera to the framing pinned
      when presentation mode was entered.
    • The error relay is rate-limited inside the sandbox and banners
      self-dismiss — nothing red may camp on the artwork for a week.

  SECURITY MODEL — the same as the in-app preview: dropped/shared shader code is
  treated as ADVERSARIAL and executes ONLY inside a sandboxed iframe
  (sandbox="allow-scripts", NO allow-same-origin → opaque origin). The top-level
  document (this page, its localStorage, the drop UI) is never reachable by
  shader code; the two sides talk exclusively over postMessage. Blob URLs are
  origin-scoped, so shader source and model bytes are shipped into the iframe
  and their blob URLs are minted there.

  Self-contained: the iframe loads the SAME vendored A-Frame 1.8.0 + Three.js
  r184 WebGPU bundle and shaderloader 0.5 the app uses (absolute URLs off this
  page's origin), so it deploys anywhere the app does (e.g. alvismisjuns.podest.lv).
  Reached from the editor's "P" toolbar button.

  Dev:      http://localhost:5173/FastShaders/podest.html
  Deployed: <origin>/FastShaders/podest.html
-->
<style>
  :root {
    --panel-bg: #f7f7f8;
    --panel-border: #d7d7db;
    --text: #1b1c1f;
    --text-dim: #6a6c72;
    --accent: #2f6df6;
    --shadow: 4px 4px 0 rgba(0, 0, 0, 0.12);
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #202227;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* ── Property panel ─────────────────────────────────────────────── */
  #panel {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    width: 288px; max-height: calc(100vh - 24px);
    display: flex; flex-direction: column;
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 0; box-shadow: var(--shadow);
    color: var(--text); font-size: 13px; overflow: hidden;
  }
  #panel.collapsed .panel__body { display: none; }
  .panel__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
    cursor: pointer; user-select: none;
  }
  /* 2× title — the panel head doubles as the page's only branding. */
  .panel__title { font-weight: 700; letter-spacing: -0.02em; font-size: 26px; line-height: 1.1; }
  .panel__collapse { background: none; border: none; font-size: 15px; color: var(--text-dim); cursor: pointer; line-height: 1; padding: 0 2px; }
  .panel__body { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }

  .dropzone {
    border: 1.5px dashed var(--panel-border); border-radius: 0;
    padding: 14px 10px; text-align: center; color: var(--text-dim);
    cursor: pointer; transition: border-color .12s, color .12s, background .12s; line-height: 1.4;
  }
  .dropzone:hover { border-color: var(--accent); color: var(--accent); }
  .dropzone strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }

  .loaded { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--text-dim); }
  /* Explicit, for the reason spelled out at #spin-speed below: `[hidden]` is a
     UA-origin rule, so the `display: flex` above outranks it and the empty
     "loaded" box kept claiming one of the panel body's 14px gaps — a dead band
     between the drop area and the green button until a file is dropped. */
  .loaded[hidden] { display: none; }
  .loaded .row { display: flex; gap: 6px; align-items: baseline; }
  .loaded .row span:first-child { flex-shrink: 0; }
  .loaded .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .section__label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px; }
  .controls-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  select, .btn {
    font: inherit; font-size: 12px; background: #fff; color: var(--text);
    border: 1px solid var(--panel-border); border-radius: 0; padding: 5px 8px; cursor: pointer;
  }
  select { flex: 1; min-width: 0; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .ctl-label { flex-shrink: 0; min-width: 72px; font-size: 12px; color: var(--text-dim); }
  /* The panel's own Fullscreen button — the labelled twin of the floating ⛶.
     Declared after `.btn:hover` so its hover colours win at equal specificity. */
  .btn--fs { width: 100%; padding: 9px 8px; font-weight: 700; color: #fff; background: #2e9e57; border-color: #268049; }
  .btn--fs:hover { color: #fff; background: #268049; border-color: #1f6a3c; }
  .check { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); cursor: pointer; margin: 0; }
  /* Compact panel: explanations live in `title` tooltips on the controls and
     section labels, never as inline hint text. */
  /* Work folder — the panel's primary action, kiosk-sized at roughly 2× a
     normal control. */
  .btn--work { width: 100%; padding: 12px 8px; font-size: 15px; font-weight: 700; }
  #work-select { width: 100%; }
  .cycle-dur { width: 56px; font: inherit; font-size: 12px; color: var(--text); background: #fff; border: 1px solid var(--panel-border); border-radius: 0; padding: 5px 6px; text-align: right; }
  .ctl-unit { font-size: 11px; color: var(--text-dim); }
  .color-input { width: 34px; height: 28px; flex-shrink: 0; padding: 0; border: 1px solid var(--panel-border); border-radius: 0; background: #fff; cursor: pointer; }
  .speed-slider { flex: 1; min-width: 0; accent-color: var(--accent); cursor: pointer; margin: 0; }
  /* The spin speed pair only exists while spin is on. Explicit rules rather
     than leaning on [hidden]: that lives in the UA origin, so ANY author
     `display` later added to these selectors would silently outrank it. */
  #spin-speed[hidden], #spin-speed-val[hidden] { display: none; }
  #spin-speed-val { flex-shrink: 0; min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ── Uniform sliders ────────────────────────────────────────────── */
  #uniforms { display: flex; flex-direction: column; gap: 12px; }
  #uniforms .empty { color: var(--text-dim); font-size: 11px; font-style: italic; }
  .u-row { display: flex; flex-direction: column; gap: 4px; }
  .u-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .u-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-val { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--accent); background: #fff; border: 1px solid var(--panel-border); border-radius: 0; width: 62px; text-align: right; padding: 1px 4px; flex-shrink: 0; }
  .u-slider { width: 100%; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .u-color { width: 44px; height: 22px; padding: 0; border: 1px solid var(--panel-border); border-radius: 0; background: #fff; cursor: pointer; flex-shrink: 0; }
  .u-bounds { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-dim); }
  .u-bounds input { width: 52px; font: inherit; font-size: 10px; color: var(--text-dim); background: #fff; border: 1px solid var(--panel-border); border-radius: 0; padding: 1px 3px; text-align: center; }
  .u-bounds span { flex: 1; text-align: center; }

  /* ── Title overlay ──────────────────────────────────────────────── */
  /* The bar spans the top but is click-through, so it can never swallow an
     orbit drag; only the name itself and its editor take pointer events.
     It sits BELOW the panel (z-index 19 < 20) so a long name slides under
     the panel instead of over it — and in fullscreen, where the panel is
     gone, the column is allowed to grow wider. */
  #title-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 19; display: none; justify-content: center; padding: 20px 12px 0; pointer-events: none; }
  #title-bar.show { display: flex; }
  #title-col { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: min(58vw, 720px); }
  :root.is-present #title-col { max-width: min(88vw, 1100px); }
  #title-text {
    pointer-events: auto; cursor: text; text-align: center; overflow-wrap: anywhere;
    font-size: clamp(18px, 3.2vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
    padding: 4px 14px; border-radius: 0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    transition: background .12s;
  }
  #title-text:hover, #title-text:focus-visible { background: rgba(128, 128, 128, 0.22); outline: none; }
  #title-text.is-placeholder { font-size: clamp(12px, 1.3vw, 16px); font-weight: 600; opacity: 0.45; text-shadow: none; }
  /* Presentation mode — an unnamed title shows nothing at all. */
  :root.is-present #title-text.is-placeholder { display: none; }
  #title-editor { pointer-events: auto; display: none; align-items: center; gap: 6px; padding: 6px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 0; box-shadow: var(--shadow); }
  #title-editor.show { display: flex; }
  #title-input { font: inherit; font-size: 13px; color: var(--text); background: #fff; border: 1px solid var(--panel-border); border-radius: 0; padding: 5px 8px; width: min(46vw, 300px); }

  /* ── Fullscreen ─────────────────────────────────────────────────── */
  /* One button, two states: ⛶ enters, ⤡ leaves (never ✕ — that reads as
     "close"). Fullscreen strips every piece of chrome; the button itself
     fades out too and returns on pointer activity, which the stage iframe
     forwards (fs:activity) since it covers the whole viewport. */
  #fs-btn { position: fixed; right: 12px; bottom: 12px; z-index: 21; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 15px; line-height: 1; color: #fff; background: rgba(20, 21, 25, 0.55); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 0; cursor: pointer; opacity: 0.55; transition: opacity .2s, background .12s; }
  #fs-btn:hover { opacity: 1; background: rgba(20, 21, 25, 0.85); }
  /* `is-present` = presentation mode, which OUTLIVES the Fullscreen API: an
     involuntary reload (browser auto-update, power blip) cannot re-enter
     fullscreen without a user gesture, and a pedestal has nobody to give one.
     So the chrome-hiding hangs off is-present (persisted, also settable with
     ?present=1), while `is-fs` — true window fullscreen — only governs the
     button's own auto-fade, since in windowed presentation the button is the
     way back in. */
  :root.is-present #panel, :root.is-present #hint { display: none; }
  :root.is-fs #fs-btn { opacity: 0; pointer-events: none; }
  :root.is-fs.is-active #fs-btn { opacity: 0.55; pointer-events: auto; }

  /* ── Drop overlay + error ───────────────────────────────────────── */
  #overlay { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(30, 40, 70, 0.55); backdrop-filter: blur(2px); color: #fff; font-size: 22px; font-weight: 700; pointer-events: none; }
  #overlay.show { display: flex; }
  /* max-height + overflow bound the banner — its text is sandbox-controlled
     (fs:error), so it must not be able to grow over the whole page. */
  #error { position: fixed; top: 12px; left: 12px; z-index: 30; max-width: 42vw; max-height: 40vh; overflow-y: auto; color: #fff; background: rgba(180, 40, 40, 0.92); font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; padding: 8px 12px; border-radius: 0; display: none; }
  #error.show { display: block; cursor: pointer; }
  /* Presentation mode: nothing is allowed over the artwork. The stage
     watchdog restarts a broken stage on its own, and the banner is back the
     moment presentation mode is left. */
  :root.is-present #error { display: none; }
  #hint { position: fixed; bottom: 12px; left: 12px; z-index: 20; color: rgba(255,255,255,0.6); font-size: 11px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  /* ── FPS / frame-time readout ───────────────────────────────────────
     Opt-in from the panel, drawn over the top-left corner. Deliberately NOT
     in the `:root.is-present` hide rule: the number is only worth anything at
     the resolution the exhibit actually runs at, which IS presentation mode —
     and it is off by default, so it can only be there because someone asked
     for it. It sits UNDER the error banner (z-index 29 < 30), which shares
     this corner and outranks a diagnostic when both want it. */
  #stats { position: fixed; top: 12px; left: 12px; z-index: 29; display: none;
           color: #fff; background: rgba(20, 21, 25, 0.55); border: 1px solid rgba(255, 255, 255, 0.18);
           border-radius: 0; padding: 4px 8px; font: 12px/1.35 ui-monospace, Menlo, monospace;
           font-variant-numeric: tabular-nums; white-space: pre; pointer-events: none; }
  #stats.show { display: block; }
  /* ── Microphone arm light ───────────────────────────────────────────
     Shown ONLY when the loaded shader declares mic uniforms. Same visual
     language as the Mic node's light in the editor (green idle, amber while
     the prompt is open, blinking red while capturing) so the two read as one
     control in two places.

     Deliberately NOT in the `:root.is-present` hide rule above: everything
     else is hidden in presentation mode because nothing may sit over the
     artwork, but a blinking red light IS the privacy indicator — the browser's
     own indicator is per-tab and a pedestal display has no visible tab strip.
     An indicator that disappears exactly when the machine is left unattended
     would be the worst possible behaviour. */
  #mic-btn { position: fixed; left: 12px; bottom: 12px; z-index: 21; display: none;
             width: 34px; height: 34px; padding: 0; border: 2px solid rgba(0,0,0,0.45);
             border-radius: 50%; background: #35c759; cursor: pointer; }
  #mic-btn.show { display: block; }
  #mic-btn.is-starting { background: #f0a500; cursor: progress; }
  #mic-btn.is-live { background: #e03131; animation: mic-blink 1s steps(1, end) infinite; }
  #mic-btn.is-failed { background: #e08a1e; }
  #mic-btn:disabled { background: #b9bec4; cursor: not-allowed; }
  @keyframes mic-blink {
    0%, 49%   { background: #e03131; box-shadow: 0 0 10px 3px rgba(224,49,49,0.7); }
    50%, 100% { background: #7a1c1c; box-shadow: none; }
  }
  /* Keep the red + glow (the signal) and drop only the flashing. */
  @media (prefers-reduced-motion: reduce) {
    #mic-btn.is-live { animation: none; box-shadow: 0 0 10px 3px rgba(224,49,49,0.7); }
  }
  /* The hint shares the bottom-left corner — step it aside when the light is up. */
  body.has-mic #hint { left: 58px; }

  /* ── Model animation controls ───────────────────────────────────────
     A dropped glTF that carries clips gets a play/pause + in-place pill in the
     bottom-left and a scrubber running across to the ⛶ button, mirroring the
     editor preview's arrangement in podest's own white-on-translucent-dark
     chrome (the editor's frosted-white pills would be a foreign object here,
     and its near-black timeline would vanish into a dark artwork — the line is
     drawn light with a dark halo instead, the same "one light line beside one
     dark line" rule, mirrored for this palette).

     UNLIKE the mic light, this IS in the `:root.is-present` hide rule:
     playback controls are chrome over the artwork, not a privacy indicator.
     `presenting()` is true for real fullscreen as well as the remembered mode,
     so one rule covers both. */
  #anim-bar { position: fixed; left: 12px; right: 58px; bottom: 12px; z-index: 21;
              display: none; align-items: center; gap: 8px;
              /* Spans most of the viewport, so it must stay transparent to the
                 pointer or an orbit drag aimed at the gap would die on it. */
              pointer-events: none; }
  #anim-bar.show { display: flex; }
  #anim-bar > * { pointer-events: auto; }
  :root.is-present #anim-bar { display: none; }
  /* The mic light owns the bottom-left corner when it is up (same rule #hint
     follows), and the hint steps above the bar rather than under it. */
  body.has-mic #anim-bar { left: 58px; }
  body.has-anim #hint { bottom: 56px; }

  #anim-pill { display: flex; align-items: center; gap: 6px; padding: 5px 6px;
               background: rgba(20, 21, 25, 0.55); border: 1px solid rgba(255, 255, 255, 0.18);
               border-radius: 0; }
  #anim-pill button { width: 28px; height: 28px; display: flex; align-items: center;
                      justify-content: center; padding: 0; font-size: 13px; line-height: 1;
                      color: #fff; background: rgba(255, 255, 255, 0.06);
                      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 0;
                      cursor: pointer; }
  #anim-pill button:hover { background: rgba(255, 255, 255, 0.16); }
  /* Lit while root motion is suppressed — a held state, so the control stays
     visibly down rather than flashing on press. */
  #anim-inplace.is-on, #anim-clips-btn.is-on { background: rgba(255, 255, 255, 0.28); border-color: rgba(255, 255, 255, 0.55); }
  #anim-inplace:disabled { opacity: 0.35; cursor: default; background: rgba(255, 255, 255, 0.06); }

  /* --thumb is the ONE place the scrubber's size is written: the line's end
     insets derive from it and the JS reads it back off the element, so the
     number cannot drift between the stylesheet and the script. */
  #anim-timeline { --thumb: 20px; position: relative; flex: 1; height: 28px; min-width: 40px;
                   cursor: pointer; touch-action: none; }
  #anim-line { position: absolute; top: 50%; left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2);
               height: 2px; transform: translateY(-50%); background: rgba(255, 255, 255, 0.9);
               box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45); border-radius: 0; pointer-events: none; }
  /* border-box because podest ships no global reset: without it the 1px border
     makes the thumb 22px wide while the line's end insets stay at 20/2, so the
     thumb's extremes overhang the track it is meant to run along. The script
     reads the LIVE offsetWidth, so the two only agree when this does. */
  #anim-thumb { position: absolute; top: 50%; left: calc(var(--thumb) / 2); box-sizing: border-box;
                width: var(--thumb); height: var(--thumb); transform: translate(-50%, -50%);
                background: rgba(20, 21, 25, 0.75); border: 1px solid rgba(255, 255, 255, 0.55);
                border-radius: 0;
                /* The track owns the pointer capture; the thumb must not eat
                   the pointerdown that starts a scrub on top of it. */
                pointer-events: none; }

  /* Clip picker — the pill's ☰ button (right-click / long-press the pill are
     shortcuts). Anchored in JS. */
  #anim-clips { position: fixed; z-index: 32; display: none; min-width: 140px; max-width: 260px;
                max-height: 50vh; overflow-y: auto; padding: 4px;
                background: rgba(20, 21, 25, 0.94); border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 0; box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5); }
  #anim-clips.show { display: block; }
  :root.is-present #anim-clips { display: none; }
  #anim-clips .clip-head { padding: 3px 8px 5px; font-size: 10px; font-weight: 700;
                           letter-spacing: 0.04em; text-transform: uppercase;
                           color: rgba(255, 255, 255, 0.55); user-select: none; }
  #anim-clips button { display: flex; align-items: center; gap: 6px; width: 100%;
                       padding: 4px 8px; font: 12px/1.4 system-ui, sans-serif; text-align: left;
                       color: #fff; background: none; border: none; border-radius: 0;
                       cursor: pointer; }
  #anim-clips button:hover { background: rgba(255, 255, 255, 0.12); }
  #anim-clips button.is-active { font-weight: 700; }
  /* Fixed-width marker column so the names keep one left edge whether or not a
     row carries the dot. */
  #anim-clips .clip-mark { flex: 0 0 auto; width: 8px; font-size: 9px; line-height: 1; }
  #anim-clips .clip-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Mesh-material picker — the panel's "Mesh materials…" button is the PRIMARY
     path; right-clicking the 3D view is the shortcut (the stage forwards the
     contextmenu, since that iframe covers the whole viewport). Same visual as
     the clip picker, and — like it, and UNLIKE the mic light — it IS in the
     is-present hide rule: authoring chrome over the artwork is exactly what
     presentation mode exists to remove. */
  #parts-menu { position: fixed; z-index: 32; display: none; min-width: 168px; max-width: 300px;
                max-height: 60vh; overflow-y: auto; padding: 4px;
                background: rgba(20, 21, 25, 0.94); border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 0; box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5); }
  #parts-menu.show { display: block; }
  :root.is-present #parts-menu { display: none; }
  #parts-menu .parts-head { padding: 3px 8px 5px; font-size: 10px; font-weight: 700;
                            letter-spacing: 0.04em; text-transform: uppercase;
                            color: rgba(255, 255, 255, 0.55); user-select: none; }
  #parts-menu .parts-mesh { padding: 6px 8px 3px; font-size: 11px; font-weight: 700;
                            color: rgba(255, 255, 255, 0.78); user-select: none;
                            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #parts-menu .parts-mesh + .parts-mesh, #parts-menu button + .parts-mesh {
                            border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 3px; }
  #parts-menu button { display: flex; align-items: center; gap: 6px; width: 100%;
                       padding: 4px 8px 4px 14px; font: 12px/1.4 system-ui, sans-serif; text-align: left;
                       color: #fff; background: none; border: none; border-radius: 0;
                       cursor: pointer; }
  #parts-menu button:hover { background: rgba(255, 255, 255, 0.12); }
  #parts-menu button.is-active { font-weight: 700; }
  #parts-menu .parts-mark { flex: 0 0 auto; width: 8px; font-size: 9px; line-height: 1; }
  #parts-menu .parts-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<!-- allow needs the explicit `*`: a bare feature name means the 'src'
     allowlist, which can never match this srcdoc iframe's sandbox-issued
     OPAQUE origin — Safari then blocks fullscreen by permissions policy. -->
<iframe id="stage" sandbox="allow-scripts" allow="fullscreen *; xr-spatial-tracking *" allowfullscreen title="Shader stage"></iframe>
<div id="error"></div>
<div id="stats"></div>
<div id="overlay">Drop shader · model · zip</div>
<div id="hint">Drop a shader (.js/.tsl), a model (.glb/.gltf/.obj), or a .zip anywhere — or click the panel drop area.</div>

<div id="title-bar">
  <div id="title-col">
    <div id="title-text" role="button" tabindex="0" title="Click to edit the name and its color"></div>
    <div id="title-editor">
      <input id="title-input" type="text" maxlength="120" spellcheck="false" placeholder="Shader name" aria-label="Title text" />
      <input id="title-color" class="color-input" type="color" title="Title color" aria-label="Title color" />
    </div>
  </div>
</div>

<button id="fs-btn" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>

<button id="mic-btn" type="button" title="Start microphone" aria-label="Start microphone"></button>

<div id="anim-bar">
  <div id="anim-pill">
    <button id="anim-play" type="button" title="Play model animation" aria-label="Play model animation">&#9654;</button>
    <button id="anim-inplace" type="button" title="Play in place: hold the model still and drop the animation&rsquo;s root movement" aria-label="Play in place">&#9678;</button>
    <button id="anim-clips-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Animation clips" aria-label="Animation clips">&#9776;</button>
  </div>
  <div id="anim-timeline" role="slider" tabindex="0" aria-label="Animation timeline" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <div id="anim-line"></div>
    <div id="anim-thumb"></div>
  </div>
</div>
<div id="anim-clips" role="menu" aria-label="Animation clips"></div>
<div id="parts-menu" role="menu" aria-label="Mesh materials"></div>

<div id="panel">
  <div class="panel__head" id="panel-head">
    <span class="panel__title">Podest</span>
    <button class="panel__collapse" id="panel-collapse" title="Collapse">▾</button>
  </div>
  <div class="panel__body">
    <button class="btn btn--work" id="work-btn" type="button" title="Pick a folder of exported shaders — every .js and .zip inside appears in the list below, ready to show or cycle through">Work folder…</button>
    <input type="file" id="work-input" webkitdirectory multiple hidden />
    <div class="section" id="work-section" hidden>
      <select id="work-select" title="Shaders found in the folder — pick one to show it"></select>
      <div class="controls-row" style="margin-top:6px;">
        <button class="btn" id="cycle-toggle" title="Show each shader from the folder in turn">Cycle</button>
        <label class="check" title="Cycle in random order"><input type="checkbox" id="cycle-shuffle" /> Shuffle</label>
        <input type="number" id="cycle-dur" class="cycle-dur" min="5" max="3600" step="1" title="Seconds each shader stays up while cycling" />
        <span class="ctl-unit">s</span>
      </div>
    </div>

    <div class="dropzone" id="dropzone">
      <strong>Drop a file</strong>
      shader (.js / .tsl) · model (.glb / .gltf / .obj) · archive (.zip)
    </div>
    <input type="file" id="file-input" accept=".js,.mjs,.tsl,.txt,.glb,.gltf,.obj,.zip" multiple hidden />

    <div class="loaded" id="loaded" hidden></div>

    <!-- The primary action sits directly under what was loaded, NOT at the
         bottom of the panel. It is the button that starts the show —
         "Fullscreen" on a screen, "Enter VR" on a headset — and below it the
         panel runs Scene → Unattended → Title → Properties, the last of which
         GROWS with the shader's property count. A tuned shader pushed the
         green button off the bottom of a 288px panel, so the one control a
         visitor is meant to press was the one they had to scroll for. -->
    <button class="btn btn--fs" id="fs-panel-btn" type="button" title="Show the shader full-screen with no controls">Fullscreen</button>

    <div class="section">
      <div class="section__label">Scene</div>
      <div class="controls-row">
        <select id="geo-select">
          <option value="sphere">Sphere</option>
          <option value="cube">Cube</option>
          <option value="plane">Plane</option>
          <option value="teapot">Teapot</option>
          <option value="bunny">Bunny</option>
        </select>
      </div>
      <!-- Spin sits UNDER the scene picker and owns its own row: the speed
           slider appears to its RIGHT only while spin is on. A speed control
           beside a stopped turntable does nothing, and in a 288px panel it
           cost a whole labelled row to say so. -->
      <div class="controls-row" style="margin-top:6px;">
        <button class="btn" id="spin-toggle" title="Toggle auto-rotate">Spin</button>
        <input type="range" id="spin-speed" class="speed-slider" min="0.1" max="4" step="0.05" title="Auto-rotate speed" hidden />
        <span class="ctl-unit" id="spin-speed-val" hidden></span>
      </div>
      <div class="controls-row" style="margin-top:6px;">
        <button class="btn" id="mat-toggle" hidden title="Switch between the shader and the model's own materials">Show model materials</button>
        <button class="btn" id="reset-view" title="Reset camera">Reset view</button>
      </div>
      <!-- A VISIBLE affordance for the mesh-material picker. Right-clicking the
           3D view opens the same menu, but a right-click-only control that
           silently does nothing on the models that lack parts is
           indistinguishable from a broken feature — the exact mistake the
           animation clip picker shipped with and had to correct. Hidden until
           the loaded shader really has materials to assign. -->
      <!-- The ROW carries the `hidden`, not the button: a hidden button inside
           a shown row still leaves its 6px margin behind as dead space. -->
      <div class="controls-row" id="parts-row" hidden style="margin-top:6px;">
        <button class="btn" id="parts-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Assign this shader's materials to the model's meshes">Mesh materials…</button>
      </div>
      <div class="controls-row" style="margin-top:6px;">
        <label class="ctl-label" for="bg-color">Background</label>
        <input type="color" id="bg-color" class="color-input" title="Scene background color" />
      </div>
      <label class="check" style="margin-top:6px;" title="Frames per second and the time between presented frames, over the top-left corner. The period includes vsync, so it reads the display's refresh rate until the shader actually misses frames."><input type="checkbox" id="stats-toggle" /> Show FPS and frame time</label>
    </div>

    <div class="section">
      <div class="section__label" title="For pedestal use. Fullscreen also keeps the display awake, and the 3D stage restarts itself if it stalls or loses its GPU device.">Unattended</div>
      <label class="check" title="The last drop — with its tuned properties — is remembered and reopened after a reload, auto-update, or power blip."><input type="checkbox" id="restore-toggle" /> Reopen the last file after a reload</label>
      <label class="check" style="margin-top:6px;" title="90 s after the last input, the camera returns to the framing saved when fullscreen was entered."><input type="checkbox" id="viewreturn-toggle" /> Return the view after 90 s idle</label>
    </div>

    <div class="section">
      <div class="section__label">Title</div>
      <label class="check" title="Taken from the dropped file name. Click the name itself to change its text and color — it stays visible in fullscreen."><input type="checkbox" id="title-toggle" /> Show the name over the shader</label>
    </div>

    <div class="section">
      <div class="section__label">Properties</div>
      <div id="uniforms"><div class="empty">Load a shader to expose its properties.</div></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var stage = document.getElementById("stage");
  var errEl = document.getElementById("error");
  var loadedEl = document.getElementById("loaded");
  var uniformsEl = document.getElementById("uniforms");
  var matToggle = document.getElementById("mat-toggle");
  var geoSelect = document.getElementById("geo-select");
  var overlay = document.getElementById("overlay");
  var titleBar = document.getElementById("title-bar");
  var titleTextEl = document.getElementById("title-text");
  var titleEditor = document.getElementById("title-editor");
  var titleInput = document.getElementById("title-input");
  var titleColorEl = document.getElementById("title-color");
  var titleToggle = document.getElementById("title-toggle");
  var fsBtn = document.getElementById("fs-btn");
  var fsPanelBtn = document.getElementById("fs-panel-btn");
  var statsEl = document.getElementById("stats");
  var partsMenuEl = document.getElementById("parts-menu");
  var partsBtn = document.getElementById("parts-btn");
  var partsRow = document.getElementById("parts-row");
  var docEl = document.documentElement;

  // Per-geometry resting tilt, matching the in-app preview.
  var ROTATIONS = { sphere: "45 45 0", cube: "45 45 0", plane: "0 0 0", teapot: "15 35 0", bunny: "0 25 0", model: "0 0 0" };

  var DEFAULT_BG = "#303540", SPIN_BASE_DUR = 12000;  // dur at speed 1×
  var DEFAULT_TITLE_COLOR = "#ffffff", TITLE_MAX = 120;
  var state = {
    shaderSource: null,    // text of the current shader module (null = none)
    shaderName: null,
    modelBytes: null,      // ArrayBuffer of a dropped model (null = none)
    modelName: null,
    modelKind: null,       // "obj" | "gltf" — set by loadModelBuffer
    geometry: "sphere",
    showMaterials: false,  // model-materials mode (shader detached in the iframe)
    spinning: readStr("fs:viewerSpin", "1") !== "0",
    spinSpeed: clampSpeed(readNum("fs:viewerSpinSpeed", 1)),
    bgColor: isHex6(readStr("fs:viewerBg", DEFAULT_BG)) ? readStr("fs:viewerBg", DEFAULT_BG) : DEFAULT_BG,
    bounds: loadBounds(),  // { uniformName: {min,max} } persisted here (top origin)
    values: {},            // last slider value per uniform name
    // Mesh name -> part name, or null for "the shader's default material".
    // SESSION state, owned here so it survives a stage rebuild (device loss,
    // the stall watchdog, the ~4.4 h time fold) — see sendPartAssignments.
    // Deliberately NOT persisted: an assignment only means anything against
    // the exact shader AND model pair that produced it, and both are dropped.
    // Null-prototype: the keys are mesh names out of a dropped model file, so
    // a mesh called `__proto__` would otherwise reach Object.prototype through
    // a bracket assignment (the same trap the loader's Map avoids).
    partAssign: Object.create(null),
    // Title overlay. titleText is "" until a shader is dropped or the user
    // types one; only a USER-typed name is persisted (an auto-derived name
    // must not outlive the shader it names — nothing reloads the shader).
    titleShow: readStr("fs:viewerTitleShow", "1") !== "0",
    titleText: readStr("fs:viewerTitleText", "").slice(0, TITLE_MAX),
    titleColor: isHex6(readStr("fs:viewerTitleColor", DEFAULT_TITLE_COLOR))
      ? readStr("fs:viewerTitleColor", DEFAULT_TITLE_COLOR) : DEFAULT_TITLE_COLOR,
    // FPS / frame-time readout — off by default; the stage only measures and
    // reports while this is on (see applyStats).
    showStats: readStr("fs:viewerStats", "0") === "1",
    // Unattended-run options, both on by default (see the Unattended panel).
    autoRestore: readStr("fs:viewerAutoRestore", "1") !== "0",
    presenting: readStr("fs:viewerPresenting", "0") === "1",
    viewReturn: readStr("fs:viewerViewReturn", "1") !== "0",
    // Model animation. Playing defaults ON — a pedestal showing an animated
    // model that stands still reads as a broken exhibit, not as a paused one.
    // The CLIP index is deliberately not persisted: an index means nothing
    // across models, and podest replays its last drop at boot.
    animPlaying: readStr("fs:viewerAnimPlaying", "1") !== "0",
    animInPlace: readStr("fs:viewerAnimInPlace", "0") === "1",
    animClip: 0,
  };
  // What the stage last reported about the loaded model's clips; null = the
  // current model has none, which is also what hides the whole bar.
  var animInfo = null;
  var animTime = 0;        // last reported playhead, replayed across restarts
  var animScrub = false;   // the pointer owns the thumb while true
  // A slower/faster rotation is a longer/shorter animation duration.
  function spinDur() { return Math.round(SPIN_BASE_DUR / (state.spinSpeed || 1)); }
  var objCache = {};       // built-in OBJ bytes, fetched once

  // fromStage tags errors relayed from the sandboxed stage iframe (fs:error).
  // Only those may be cleared by the stage's fs:applied — trusted-page errors
  // (zip/file-read failures etc.) must never be clearable from the sandbox.
  // Length-capped: the text is sandbox-controlled on the fs:error path.
  // A pedestal must not carry a red banner over the artwork for the rest of
  // the week because of one transient hiccup, so non-sticky errors time out
  // (and any error can be clicked away). Sticky ones — the stage can never
  // work — stay until something actually succeeds.
  var errorFromStage = false, errorSticky = false, errorTimer = null;
  var ERROR_DISMISS_MS = 20000;

  /* ── Microphone input ──────────────────────────────────────────────────
     Capture lives in THIS document, never in the stage: the stage iframe is
     sandbox="allow-scripts" with no allow-same-origin, so it runs in an opaque
     origin where getUserMedia is denied below the Permissions-Policy layer.
     Values cross as ordinary fs:uniform messages — the same in-place
     _propertyUniforms write the sliders use, which is per-frame safe — so a
     parent-held capture also survives every stage restart podest performs
     (device loss, stall watchdog, the ~4.4h time fold).

     A shader's mic channels are emitted by FastShaders as `uniform(0)`, i.e.
     ordinary number properties. They are split out of the reported uniform map
     BEFORE onUniforms sees them, which in one move keeps them out of the slider
     list, out of state.values, and therefore out of the IndexedDB tuning
     record — otherwise every boot would replay a frozen room-noise level and
     pin the shader at it.

     CONSENT: the button is the only path in, and a DROP NEVER ARMS while a drop
     ALWAYS DISARMS. Auto-arming because a loaded file happens to declare mic
     uniforms would let a shared .js decide that the microphone opens — and
     because permission is keyed to ORIGIN (podest shares the editor's), a grant
     given once in the editor already covers this page, and getUserMedia needs
     no transient activation. So an auto-arm would open the mic silently at
     every boot, for weeks, on a machine nobody is watching. That is the line
     this must not cross. */
  var MIC_RE = /^mic\d*_(level|bass|mid|treble)$/;
  var micNames = [];
  var micStream = null, micCtx = null, micAnalyser = null, micBins = null;
  var micStatus = "off";           // off | starting | live | failed
  var micRaf = 0;
  var micBtn = document.getElementById("mic-btn");

  function micPaint() {
    micBtn.className =
      (micNames.length ? "show" : "") +
      (micStatus === "live" ? " is-live" : "") +
      (micStatus === "starting" ? " is-starting" : "") +
      (micStatus === "failed" ? " is-failed" : "");
    micBtn.disabled = !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
    micBtn.title = micBtn.disabled
      ? "Microphone unavailable \u2014 needs a secure connection (https)"
      : micStatus === "live" ? "Microphone is live \u2014 click to stop"
      : micStatus === "starting" ? "Waiting for microphone permission\u2026"
      : micStatus === "failed" ? "Could not start the microphone \u2014 click to retry"
      : "Start microphone (nothing is recorded)";
    document.body.classList.toggle("has-mic", micNames.length > 0);
  }

  /* Mirrors src/utils/micAnalysis.ts. Both band edges FLOOR so the bands
     partition the spectrum — flooring the low edge and ceiling the high one
     double-counts the crossover bin and makes a 200 Hz tone light up bass and
     mid equally. Raw 0..1: `gain` is already baked into the shader by codegen
     (it emits a .mul()), so applying it here too would scale twice. */
  function micBand(lo, hi, rate, n) {
    if (!(rate > 0) || n <= 0) return [0, Math.max(1, n)];
    var per = rate / (2 * n);
    var a = Math.min(Math.max(0, Math.floor(lo / per)), n - 1);
    var b = Math.min(Math.max(a + 1, Math.floor(hi / per)), n);
    return [a, b];
  }
  function micMean(arr, a, b) {
    var sum = 0;
    for (var i = a; i < b; i++) sum += arr[i];
    return b > a ? sum / (b - a) / 255 : 0;
  }
  function micTick() {
    micRaf = requestAnimationFrame(micTick);
    if (!micAnalyser) return;
    if (micBins.length !== micAnalyser.frequencyBinCount) micBins = new Uint8Array(micAnalyser.frequencyBinCount);
    micAnalyser.getByteFrequencyData(micBins);
    var n = micBins.length, rate = micCtx.sampleRate;
    var lo = micBand(0, 200, rate, n), md = micBand(200, 2000, rate, n), hi = micBand(2000, rate / 2, rate, n);
    var v = {
      level: micMean(micBins, 0, n),
      bass: micMean(micBins, lo[0], lo[1]),
      mid: micMean(micBins, md[0], md[1]),
      treble: micMean(micBins, hi[0], hi[1]),
    };
    // Skip while the stage is rebuilding: post() would only churn its 16-slot
    // queue with values that are stale by the time the stage boots.
    if (!stageReady) return;
    for (var i = 0; i < micNames.length; i++) {
      var ch = MIC_RE.exec(micNames[i]);
      if (ch) post({ type: "fs:uniform", name: micNames[i], value: v[ch[1]] });
    }
  }
  function micStop(zero) {
    if (micRaf) { cancelAnimationFrame(micRaf); micRaf = 0; }
    if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; }
    if (micCtx) { try { micCtx.close(); } catch (e) { /* already closed */ } micCtx = null; }
    micAnalyser = null;
    if (micStatus !== "failed") micStatus = "off";
    // Leave the shader at a defined rest state instead of frozen mid-sound.
    if (zero !== false && stageReady) {
      for (var i = 0; i < micNames.length; i++) post({ type: "fs:uniform", name: micNames[i], value: 0 });
    }
    micPaint();
  }
  function micStart() {
    if (micStream || micStatus === "starting") return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micStatus = "failed"; micPaint(); return; }
    micStatus = "starting"; micPaint();
    navigator.mediaDevices.getUserMedia({
      // The speech-tuned processing fights a visualiser: AGC in particular
      // re-normalizes level, so a sustained loud sound fades to mid-scale.
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      video: false,
    }).then(function (stream) {
      // The user disarmed (or dropped a new shader) while the prompt was open.
      if (micStatus !== "starting") { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      micStream = stream;
      var AC = window.AudioContext || window.webkitAudioContext;
      micCtx = new AC();
      if (micCtx.state === "suspended") micCtx.resume().catch(function () {});
      micAnalyser = micCtx.createAnalyser();
      micAnalyser.fftSize = 1024;
      micAnalyser.smoothingTimeConstant = 0.8;
      micCtx.createMediaStreamSource(stream).connect(micAnalyser);  // never to destination — that feeds back
      micBins = new Uint8Array(micAnalyser.frequencyBinCount);
      micStatus = "live"; micPaint();
      if (!micRaf) micRaf = requestAnimationFrame(micTick);
    }).catch(function () {
      micStatus = "failed"; micPaint();
    });
  }
  micBtn.addEventListener("click", function () {
    if (micStatus === "live" || micStatus === "starting") micStop();
    else { micStatus = "off"; micStart(); }
  });
  /** A new shader (or a detach) always disarms — see the CONSENT note above. */
  function micReset(names) {
    micStop(false);
    micNames = names || [];
    micStatus = "off";
    micPaint();
  }
  micPaint();

  function showError(msg, fromStage, sticky) {
    errEl.textContent = String(msg).slice(0, 2000);
    errEl.classList.add("show");
    errorFromStage = !!fromStage;
    errorSticky = !!sticky;
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
    if (!errorSticky) errorTimer = setTimeout(clearError, ERROR_DISMISS_MS);
  }
  function clearError() {
    if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
    errEl.classList.remove("show"); errEl.textContent = ""; errorFromStage = false; errorSticky = false;
  }
  errEl.addEventListener("click", clearError);

  // Escape dynamic strings (esp. dropped file names from shared archives) before
  // they enter innerHTML/title on this trusted top document.
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function loadBounds() { try { return JSON.parse(localStorage.getItem("fs:viewerBounds") || "{}") || {}; } catch (e) { return {}; } }
  function saveBounds() { try { localStorage.setItem("fs:viewerBounds", JSON.stringify(state.bounds)); } catch (e) {} }

  // Small persisted-preference readers (all guarded — private-mode / disabled
  // storage must degrade to the default, never throw).
  function readStr(k, d) { try { var v = localStorage.getItem(k); return (v === null || v === "") ? d : v; } catch (e) { return d; } }
  function readNum(k, d) { var n = parseFloat(readStr(k, "")); return isFinite(n) ? n : d; }
  function writePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function isHex6(s) { return /^#[0-9a-fA-F]{6}$/.test(String(s)); }
  function clampSpeed(s) { return Math.min(4, Math.max(0.1, isFinite(s) ? s : 1)); }

  // ── postMessage bridge to the sandboxed stage iframe ────────────────
  // The stage is DISPOSABLE: everything it shows is re-derivable from `state`,
  // so it can be torn down and rebuilt at any time (GPU device loss, a render
  // stall, or the scheduled time-wrap restart) and applyStateToStage puts it
  // back. That is what makes an unattended multi-week run survivable.
  var stageReady = false;
  var outQueue = [];
  var MAX_QUEUED = 16;   // a stage that never boots must not pin model buffers
  var iframeDrag = false;  // is a file being dragged over the stage iframe?
  function post(msg) {
    if (stageReady && stage.contentWindow) stage.contentWindow.postMessage(msg, "*");
    else { outQueue.push(msg); if (outQueue.length > MAX_QUEUED) outQueue.shift(); }
  }
  window.addEventListener("message", function (e) {
    // Accept only the stage iframe; it has an opaque origin so we can't check by
    // origin — identity via contentWindow is the reliable guard. After a
    // restart this also drops late messages from the previous document, whose
    // window is no longer stage.contentWindow.
    if (e.source !== stage.contentWindow) return;
    var m = e.data; if (!m) return;
    if (m.type === "fs:ready") {
      stageReady = true;
      outQueue = [];            // superseded by the full replay below
      applyStateToStage();
      noteStageAlive();
    } else if (m.type === "fs:beat") {
      // Liveness + time-wrap heartbeat (see the watchdog below).
      onStageBeat(m);
    } else if (m.type === "fs:stats") {
      // Frame-rate report from the stage's rAF loop (~4×/s while enabled).
      // Sandbox-controlled numbers: coerce and bound them before they reach
      // the DOM, and write textContent only.
      if (state.showStats) paintStats(m.fps, m.ms);
    } else if (m.type === "fs:stage-dead") {
      // The renderer told us it is finished (WebGPU device lost / WebGL
      // context lost). Nothing recovers in place — rebuild the stage.
      restartStage("renderer lost (" + String(m.reason || "unknown").slice(0, 80) + ")");
    } else if (m.type === "fs:uniforms") {
      // Split the mic channels off FIRST. Letting them reach onUniforms would
      // give them slider rows, a state.values entry, and therefore a place in
      // the IndexedDB tuning record — which replays a frozen room-noise level
      // at every boot. The value/bounds seeding happens before the row is
      // appended, so filtering inside onUniforms would be too late.
      var uAll = m.uniforms || {}, uRest = {}, mics = [];
      for (var uk in uAll) {
        if (!Object.prototype.hasOwnProperty.call(uAll, uk)) continue;
        if (MIC_RE.test(uk)) mics.push(uk); else uRest[uk] = uAll[uk];
      }
      micReset(mics);
      if (!state.showMaterials) onUniforms(uRest);
    } else if (m.type === "fs:parts") {
      onStageParts(m);
    } else if (m.type === "fs:contextmenu") {
      // A right-click landed on the stage iframe, which covers the whole
      // viewport so the parent never sees one. The stage only forwards these
      // while the parent has told it there is a menu to open (fs:context-hook),
      // so the browser's own menu still works everywhere else.
      openPartsMenuAt(m.x, m.y);
    } else if (m.type === "fs:anim") {
      onStageAnim(m);
    } else if (m.type === "fs:anim-time") {
      if (typeof m.time === "number" && isFinite(m.time)) {
        animTime = m.time;
        // While the user drags, the pointer owns the thumb — a report landing
        // mid-gesture would fight it back to the playhead.
        if (!animScrub) paintAnimThumb(animTime);
      }
    } else if (m.type === "fs:error") {
      showError(m.message || "Shader stage error", true, !!m.sticky);
    } else if (m.type === "fs:applied") {
      // A shader applied successfully — clear a stale stage failure. Trusted
      // top-page errors are out of the sandbox's reach, and sticky stage
      // errors (vendored-script load failures) still matter after a
      // successful apply (see showError).
      if (errorFromStage && !errorSticky) clearError();
    } else if (m.type === "fs:drag") {
      // A drag entered/left/moved over the stage iframe (which fills the
      // viewport and swallows drag events over that whole area) — mirror the
      // drop overlay. Repeated on:true beats also re-arm the safety timeout.
      iframeDrag = !!m.on; refreshOverlay();
    } else if (m.type === "fs:activity") {
      // Throttled pointer heartbeat from the stage, which covers the whole
      // viewport — without it, moving the mouse over the 3D view in
      // fullscreen would never bring the exit button back. A press there also
      // dismisses an open title editor, exactly like a press on the chrome.
      bumpActivity();
      if (m.down) commitTitle();
      // A press on the stage is the only "click outside" the parts menu can
      // ever see — the iframe covers the viewport, so no parent pointerdown
      // fires there. Safe against the gesture that OPENS it: pointerdown
      // precedes contextmenu, so this closes nothing that is not already open.
      if (m.down) closePartsMenu();
    } else if (m.type === "fs:dropped") {
      // Files were dropped ONTO the stage iframe; it forwarded the File objects
      // here so a drop anywhere loads through the same path as a panel drop.
      // Zero BOTH drag counters (a stage drop produces no parent dragleave, so
      // dragDepth would otherwise stay >0 and keep the veil up) and accept only
      // real File objects — a forged message can't crash the loader.
      dragDepth = 0; iframeDrag = false; refreshOverlay();
      var dropped = Array.isArray(m.files) ? m.files.filter(function (f) { return f instanceof File; }) : [];
      if (dropped.length) handleFiles(dropped);
    }
  });

  /* ── Model animation controls ────────────────────────────────────────────
     A-Frame core ships no animation-mixer, so the stage's `gltf-anim`
     component (pushGltfAnim, a twin of the editor's) owns the mixer and this
     half owns the buttons. The contract both ways:
       parent -> stage : fs:anim-set {playing, inPlace, clip, time}, fs:anim-seek {time}
       stage  -> parent: fs:anim {has, duration, canInPlace, name, clip, clips},
                         fs:anim-time {time}

     The stage is DISPOSABLE (device loss, the stall watchdog, the ~4.4 h time
     fold all rebuild it), so nothing here assumes continuity: the parent
     replays playing/inPlace/clip AND the playhead on every fs:anim, which is
     what keeps a restart invisible on an animated exhibit. */
  var animBar = document.getElementById("anim-bar");
  var animPlayBtn = document.getElementById("anim-play");
  var animInPlaceBtn = document.getElementById("anim-inplace");
  var animTimelineEl = document.getElementById("anim-timeline");
  var animThumbEl = document.getElementById("anim-thumb");
  var animClipsEl = document.getElementById("anim-clips");
  var animClipsBtn = document.getElementById("anim-clips-btn");
  var animPill = document.getElementById("anim-pill");

  /** Move the thumb. Imperative: the stage reports ~30x/s while playing. */
  function paintAnimThumb(time) {
    if (!animInfo || !(animInfo.duration > 0)) return;
    var w = animThumbEl.offsetWidth || 20;
    var f = time / animInfo.duration;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    animThumbEl.style.left = "calc(" + (w / 2) + "px + " + f + " * (100% - " + w + "px))";
    animTimelineEl.setAttribute("aria-valuenow", String(Math.round(time * 100) / 100));
  }

  /** Pointer x -> clip time, over the same inset span paintAnimThumb writes. */
  function animTimeFromPointer(clientX) {
    if (!animInfo || !(animInfo.duration > 0)) return 0;
    var w = animThumbEl.offsetWidth || 20;
    var r = animTimelineEl.getBoundingClientRect();
    var usable = r.width - w;
    if (usable <= 0) return 0;
    var f = (clientX - r.left - w / 2) / usable;
    f = f < 0 ? 0 : (f > 1 ? 1 : f);
    return f * animInfo.duration;
  }

  function seekAnim(t) {
    animTime = t;
    paintAnimThumb(t);
    post({ type: "fs:anim-seek", time: t });
  }

  /** Push the toggles (not the playhead) into the running stage. */
  function sendAnimState() {
    post({ type: "fs:anim-set", playing: state.animPlaying, inPlace: state.animInPlace });
  }

  function syncAnimButtons() {
    var on = !!animInfo;
    animBar.classList.toggle("show", on);
    document.body.classList.toggle("has-anim", on);
    if (!on) { closeClipMenu(); return; }
    animPlayBtn.textContent = state.animPlaying ? "⏸" : "▶";
    var many = animInfo.clips.length > 1;
    animPlayBtn.title = (state.animPlaying ? "Pause model animation" : "Play model animation")
      + (animInfo.name ? " — " + animInfo.name : "")
      + (many ? " (" + (animInfo.clip + 1) + "/" + animInfo.clips.length + ")" : "");
    animClipsBtn.title = "Animation clips (" + animInfo.clips.length + ")";
    animPlayBtn.setAttribute("aria-label", state.animPlaying ? "Pause model animation" : "Play model animation");
    // A clip with no root translation has nothing to pin; a live button that
    // does nothing reads as broken, so it goes inert instead.
    animInPlaceBtn.disabled = !animInfo.canInPlace;
    animInPlaceBtn.classList.toggle("is-on", state.animInPlace && animInfo.canInPlace);
    animInPlaceBtn.title = animInfo.canInPlace
      ? (state.animInPlace
          ? "Playing in place — click to restore the animation’s own movement"
          : "Play in place: hold the model still and drop the animation’s root movement")
      : "This animation has no root movement to remove";
    animTimelineEl.setAttribute("aria-valuemax", String(Math.round(animInfo.duration * 100) / 100));
    paintAnimThumb(animTime);
  }

  /**
   * The stage reported its clip set (or the lack of one). Coerce everything —
   * the stage is sandboxed, so these numbers are untrusted whoever wrote the
   * shader — then replay this parent's state onto it.
   */
  function onStageAnim(m) {
    var dur = (typeof m.duration === "number" && isFinite(m.duration)) ? m.duration : 0;
    if (!m.has || dur <= 0) { animInfo = null; syncAnimButtons(); return; }
    // Placeholders are substituted IN PLACE for non-string entries, never
    // compacted out — compaction would shift every later index, so the menu's
    // rows would stop matching the stage's real clip indices.
    var names = [];
    if (Array.isArray(m.clips)) {
      for (var i = 0; i < m.clips.length && i < 200; i++) {
        names.push(typeof m.clips[i] === "string" ? m.clips[i].slice(0, 120) : "");
      }
    }
    // The stage's OWN index, which it has already clamped. DISPLAY only —
    // deliberately not written back into state.animClip: a stage rebuild
    // (device loss, the stall watchdog, the ~4.4 h time fold) boots the
    // component at its schema default of 0, so adopting the report would walk
    // an unattended exhibit back to clip 0 the first time anything restarted.
    // state.animClip stays the REQUEST; this is the answer.
    var clip = (typeof m.clip === "number" && isFinite(m.clip)) ? (m.clip | 0) : 0;
    animInfo = {
      duration: dur,
      canInPlace: !!m.canInPlace,
      name: typeof m.name === "string" ? m.name.slice(0, 120) : "",
      clip: clip,
      clips: names
    };
    // Reset the remembered playhead only when the REPORTING clip is the one
    // about to be replayed: a rebuilt stage reports its schema-default clip 0
    // first, and zeroing an 8 s Walk playhead against a 2 s Idle's duration
    // made every restart visibly rewind the exhibit — the exact discontinuity
    // this replay exists to hide. On a clip switch the component's own seek()
    // clamps against the correct post-swap duration.
    if (clip === state.animClip && animTime > dur) animTime = 0;
    syncAnimButtons();
    renderClipMenu();
    // clip leads: the component re-derives duration/canInPlace and rebinds at
    // 0 on a clip change, so the time has to follow it.
    post({
      type: "fs:anim-set",
      clip: state.animClip,
      playing: state.animPlaying,
      inPlace: state.animInPlace,
      time: animTime
    });
  }

  animPlayBtn.addEventListener("click", function () {
    state.animPlaying = !state.animPlaying;
    writePref("fs:viewerAnimPlaying", state.animPlaying ? "1" : "0");
    sendAnimState();
    syncAnimButtons();
  });
  animInPlaceBtn.addEventListener("click", function () {
    state.animInPlace = !state.animInPlace;
    writePref("fs:viewerAnimInPlace", state.animInPlace ? "1" : "0");
    sendAnimState();
    syncAnimButtons();
  });

  // Capture on the TRACK, never the thumb: the thumb is repositioned by an
  // imperative style write on every report, and a pointer captured by an
  // element the gesture keeps moving is how a drag gets lost mid-sweep.
  animTimelineEl.addEventListener("pointerdown", function (e) {
    if (!animInfo) return;
    try { animTimelineEl.setPointerCapture(e.pointerId); } catch (err) {}
    animScrub = true;
    seekAnim(animTimeFromPointer(e.clientX));
  });
  animTimelineEl.addEventListener("pointermove", function (e) {
    if (!animScrub) return;
    seekAnim(animTimeFromPointer(e.clientX));
  });
  function endScrub(e) {
    animScrub = false;
    try { animTimelineEl.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  animTimelineEl.addEventListener("pointerup", endScrub);
  animTimelineEl.addEventListener("pointercancel", endScrub);
  animTimelineEl.addEventListener("keydown", function (e) {
    if (!animInfo) return;
    var step = animInfo.duration / 50, next = null;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") next = animTime + step;
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") next = animTime - step;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = animInfo.duration;
    if (next === null) return;
    e.preventDefault();
    seekAnim(Math.max(0, Math.min(animInfo.duration, next)));
  });

  /* ── Clip picker ────────────────────────────────────────────────────────
     The visible ☰ button on the pill is the PRIMARY path; right-click /
     long-press anywhere on the pill are shortcuts to the same menu. It
     shipped first as a right-click-only context menu gated on two clips,
     and that was reported as "does not work" — a control that exists on
     some models and not others, reached by a gesture that silently no-ops,
     is indistinguishable from a broken feature. */
  function closeClipMenu() {
    animClipsEl.classList.remove("show");
    animClipsBtn.classList.remove("is-on");
    animClipsBtn.setAttribute("aria-expanded", "false");
  }
  function renderClipMenu() {
    animClipsEl.textContent = "";
    // No ">= 2 clips" gate: a control that exists on some models and not
    // others is the failure the old right-click-only path had, and on a
    // single-clip file the list still answers "what is this clip called".
    if (!animInfo) { closeClipMenu(); return; }
    var head = document.createElement("div");
    head.className = "clip-head";
    head.textContent = "Animation clips";
    animClipsEl.appendChild(head);
    animInfo.clips.forEach(function (name, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "menuitemradio");
      b.setAttribute("aria-checked", i === animInfo.clip ? "true" : "false");
      if (i === animInfo.clip) b.className = "is-active";
      var mark = document.createElement("span");
      mark.className = "clip-mark";
      mark.textContent = i === animInfo.clip ? "●" : "";
      var label = document.createElement("span");
      label.className = "clip-name";
      // An unnamed clip is legal in glTF; the index is the only handle the
      // user has on it, so never render an empty row. textContent only — the
      // name came out of a dropped file.
      label.textContent = name || ("Clip " + (i + 1));
      b.title = label.textContent;
      b.appendChild(mark);
      b.appendChild(label);
      b.addEventListener("click", function () {
        state.animClip = i;
        animTime = 0;
        post({ type: "fs:anim-set", clip: i });
        closeClipMenu();
      });
      animClipsEl.appendChild(b);
    });
  }
  function openClipMenu() {
    if (!animInfo) return;
    renderClipMenu();
    animClipsEl.classList.add("show");
    animClipsBtn.classList.add("is-on");
    animClipsBtn.setAttribute("aria-expanded", "true");
    // Measured placement: this anchor is always near the bottom edge, so the
    // menu has to open UPWARD unless there is genuinely room below.
    var a = animClipsBtn.getBoundingClientRect();
    var m = animClipsEl.getBoundingClientRect();
    var left = Math.max(4, Math.min(a.left, window.innerWidth - m.width - 4));
    var above = a.top - 4 - m.height;
    var below = a.bottom + 4;
    var top = (below + m.height <= window.innerHeight - 4) ? below
            : (above >= 4 ? above : Math.max(4, window.innerHeight - m.height - 4));
    animClipsEl.style.left = left + "px";
    animClipsEl.style.top = top + "px";
  }
  function toggleClipMenu() {
    if (animClipsEl.classList.contains("show")) closeClipMenu(); else openClipMenu();
  }
  animClipsBtn.addEventListener("click", toggleClipMenu);
  // When a long-press opened the menu — the synthesized-contextmenu window.
  var clipMenuTouchTs = 0;
  // Right-click anywhere on the PILL, not just the ▶: the handler used to sit
  // on the play button alone and be suppressed below two clips, so a near-miss
  // OR a single-clip file both fell through to the browser's own menu, which is
  // indistinguishable from the feature not working. The ☰ above is the primary,
  // visible path; this is the shortcut.
  animPill.addEventListener("contextmenu", function (e) {
    if (!animInfo) return;
    e.preventDefault();
    // On Android/Quest Chromium a touch long-press ALSO synthesizes a native
    // contextmenu right as the 500 ms timer fires — without this window the
    // toggle closed the menu the same gesture just opened.
    if (performance.now() - clipMenuTouchTs < 700) return;
    toggleClipMenu();
  });
  // Touch/pen counterpart to the right-click. Mouse is ignored — right-click
  // already covers it and a hold on the left button would fight the click.
  (function () {
    var timer = null, sx = 0, sy = 0, pid = -1;
    function cancel() { if (timer !== null) { clearTimeout(timer); timer = null; } pid = -1; }
    animPill.addEventListener("pointerdown", function (e) {
      if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
      if (e.target === animClipsBtn) return;   // it already opens on tap
      cancel(); sx = e.clientX; sy = e.clientY; pid = e.pointerId;
      timer = setTimeout(function () { timer = null; clipMenuTouchTs = performance.now(); openClipMenu(); }, 500);
    });
    animPill.addEventListener("pointermove", function (e) {
      if (pid !== e.pointerId || timer === null) return;
      if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
    });
    animPill.addEventListener("pointerup", cancel);
    animPill.addEventListener("pointercancel", cancel);
  })();
  document.addEventListener("pointerdown", function (e) {
    if (!animClipsEl.classList.contains("show")) return;
    if (animClipsEl.contains(e.target) || animPill.contains(e.target)) return;
    closeClipMenu();
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && animClipsEl.classList.contains("show")) {
      e.stopPropagation();
      closeClipMenu();
    }
  }, true);

  /* ── Mesh-material picker ────────────────────────────────────────────────
     A shader module may return per-sub-mesh materials (shaderloader 0.6's
     `parts`), dispatched by mesh NAME. Drop a DIFFERENT model and those names
     stop matching, so the meshes fall back to whatever the loader's rules give
     them — and there was no way to say "this mesh takes that material". This
     menu is that way. The contract, mirroring fs:anim / fs:anim-set:

       stage  -> parent: fs:parts {meshes:[name…], parts:[name…], hasDefault}
       parent -> stage : fs:assign-part {mesh, part}   // part === null ⇒ default

     Reported after the shader applies AND after a model loads, because either
     one changes the answer. The stage applies an assignment by RE-DERIVING the
     material from the live shader component (part material → default →
     authored original) — never from a stashed reference, since the loader
     disposes the outgoing material before assigning the new one.

     The stage is DISPOSABLE, so nothing here assumes continuity: the parent
     owns the assignments and replays them (applyStateToStage on fs:ready, and
     again on every fs:parts, which is when the part materials actually exist). */
  var partsInfo = null;              // last fs:parts report, or null
  var PARTS_MAX_ROWS = 200;          // bound the report; a model has a handful
  var PARTS_NAME_MAX = 200;          // longer names are REJECTED, not truncated
  var PARTS_LABEL_MAX = 48;          // …and this is all that is ever DRAWN

  function partsAvailable() {
    return !!(partsInfo && partsInfo.meshes.length && partsInfo.parts.length);
  }

  /** Cap for DISPLAY only — the full string is the key an assignment carries. */
  function partsLabel(s) {
    return s.length > PARTS_LABEL_MAX ? s.slice(0, PARTS_LABEL_MAX - 1) + "…" : s;
  }

  /**
   * Coerce one half of a report. Over-long names are DROPPED rather than
   * truncated: the string is the protocol key, so a shortened one would
   * address no mesh at all — a row that silently does nothing. Duplicates are
   * folded (several meshes legitimately share a name; an assignment applies to
   * every match, which is the loader's own semantics).
   */
  function partsNameList(v) {
    var out = [];
    if (!Array.isArray(v)) return out;
    for (var i = 0; i < v.length && out.length < PARTS_MAX_ROWS; i++) {
      var s = v[i];
      if (typeof s !== "string" || !s || s.length > PARTS_NAME_MAX) continue;
      if (out.indexOf(s) < 0) out.push(s);
    }
    return out;
  }

  /** What the LOADER gives this mesh when nothing has been assigned to it. */
  function derivedPart(mesh) {
    if (!partsInfo) return null;
    if (partsInfo.parts.indexOf(mesh) >= 0) return mesh;
    // shaderloader 0.6: a parts-only module on a SINGLE-mesh model puts its
    // FIRST part on that mesh. A multi-mesh model keeps its authored materials
    // instead, which is why the count is part of the test here too.
    if (!partsInfo.hasDefault && partsInfo.meshes.length === 1 && partsInfo.parts.length) {
      return partsInfo.parts[0];
    }
    return null;   // the default material — or the authored one when there is none
  }

  /**
   * Replay every stored assignment onto the stage. Idempotent by design.
   *
   * Each entry is checked against the CURRENT report first, because an
   * assignment naming a part this shader does not have is not inert: the stage
   * resolves an unknown part to the DEFAULT material, so replaying a stale one
   * would actively override what the loader had just decided for that mesh.
   */
  function sendPartAssignments() {
    if (!partsAvailable()) return;
    var a = state.partAssign;
    for (var mesh in a) {
      if (!Object.prototype.hasOwnProperty.call(a, mesh)) continue;
      if (partsInfo.meshes.indexOf(mesh) < 0) continue;
      var p = a[mesh];
      if (p !== null && partsInfo.parts.indexOf(p) < 0) continue;
      post({ type: "fs:assign-part", mesh: mesh, part: p });
    }
  }

  function onStageParts(m) {
    var meshes = partsNameList(m.meshes);
    var parts = partsNameList(m.parts);
    partsInfo = { meshes: meshes, parts: parts, hasDefault: !!m.hasDefault };
    // PRUNE against the fresh report — but ONLY against a report that carries
    // both halves. An EMPTY report means "nothing is loaded right now", not
    // "these assignments are invalid", and empty reports are routine: every
    // stage rebuild replays the geometry, whose clearGeo posts one before the
    // model has loaded. Pruning on that would wipe the assignments on exactly
    // the restart this replay exists to make invisible. (Nothing stale is ever
    // SENT either way — sendPartAssignments re-checks each entry.)
    if (meshes.length && parts.length) {
      var keep = Object.create(null), a = state.partAssign;
      for (var mesh in a) {
        if (!Object.prototype.hasOwnProperty.call(a, mesh)) continue;
        if (meshes.indexOf(mesh) < 0) continue;
        var p = a[mesh];
        if (p !== null && parts.indexOf(p) < 0) continue;
        keep[mesh] = p;
      }
      state.partAssign = keep;
    }
    syncPartsButton();
    if (partsMenuEl.classList.contains("show")) renderPartsMenu();
    // NOW the part materials exist — the applyStateToStage replay ran before
    // the shader had even finished importing.
    sendPartAssignments();
  }

  function syncPartsButton() {
    var on = partsAvailable();
    partsRow.hidden = !on;
    if (!on) closePartsMenu();
    else {
      partsBtn.title = "Assign this shader's " + partsInfo.parts.length
        + " material" + (partsInfo.parts.length === 1 ? "" : "s")
        + " to the model's " + partsInfo.meshes.length
        + " mesh" + (partsInfo.meshes.length === 1 ? "" : "es")
        + " — or right-click the 3D view";
    }
    // Tell the stage whether to intercept right-clicks at all. With nothing to
    // assign it must NOT: a swallowed contextmenu that opens no menu removes
    // the browser's own for no gain.
    post({ type: "fs:context-hook", on: on });
  }

  function closePartsMenu() {
    partsMenuEl.classList.remove("show");
    partsBtn.classList.remove("active");
    partsBtn.setAttribute("aria-expanded", "false");
  }

  function renderPartsMenu() {
    partsMenuEl.textContent = "";
    if (!partsAvailable()) { closePartsMenu(); return; }
    var head = document.createElement("div");
    head.className = "parts-head";
    head.textContent = "Mesh materials";
    partsMenuEl.appendChild(head);
    partsInfo.meshes.forEach(function (mesh) {
      var explicit = Object.prototype.hasOwnProperty.call(state.partAssign, mesh);
      var current = explicit ? state.partAssign[mesh] : derivedPart(mesh);
      var h = document.createElement("div");
      h.className = "parts-mesh";
      // textContent only, and capped — the name came out of a dropped file.
      h.textContent = partsLabel(mesh);
      h.title = partsLabel(mesh);
      partsMenuEl.appendChild(h);
      // The null row first: it is how an assignment is UNDONE. Its wording
      // follows what null actually resolves to — the module's own default
      // material, or (a parts-only module) the material the model was
      // authored with.
      var rows = [{ part: null, label: partsInfo.hasDefault ? "Default material" : "Model’s own material" }];
      partsInfo.parts.forEach(function (p) { rows.push({ part: p, label: partsLabel(p) }); });
      rows.forEach(function (row) {
        var b = document.createElement("button");
        b.type = "button";
        b.setAttribute("role", "menuitemradio");
        var active = row.part === current;
        b.setAttribute("aria-checked", active ? "true" : "false");
        if (active) b.className = "is-active";
        var mark = document.createElement("span");
        mark.className = "parts-mark";
        mark.textContent = active ? "●" : "";
        var label = document.createElement("span");
        label.className = "parts-name";
        label.textContent = row.label;
        b.title = row.label;
        b.appendChild(mark);
        b.appendChild(label);
        b.addEventListener("click", function () {
          state.partAssign[mesh] = row.part;
          post({ type: "fs:assign-part", mesh: mesh, part: row.part });
          // Repaint but stay OPEN: assigning materials is a per-mesh sweep,
          // and closing after each pick would mean reopening once per mesh.
          renderPartsMenu();
        });
        partsMenuEl.appendChild(b);
      });
    });
  }

  /** Measured placement inside the viewport, from an anchor rect. */
  function placePartsMenu(rect) {
    var m = partsMenuEl.getBoundingClientRect();
    var left = Math.max(4, Math.min(rect.left, window.innerWidth - m.width - 4));
    var below = rect.bottom + 4;
