name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: pushing twice in a minute should not leave two suites racing
# for the same answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build and the suite NEED the a-frame-shaderloader submodule:
          # public/js/ is not tracked — scripts/sync-generated.mjs writes it from
          # the submodule's js/ at every build/test start, and refuses to start
          # without it — and the loader suites read the loader sources
          # themselves (the frozen 0.6 and the current 0.8). release.yml checks
          # out submodules on all three of its jobs for the same reason.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` (tsc -b && vite build), NOT `tsc --noEmit`. Two holes
      # close together: --noEmit does not follow project references, so
      # vite.config.ts — which owns the build CSP, the FS_DESKTOP profile, every
      # custom plugin and the rollup input map — was never typechecked at all
      # (--listFiles showed 884 src files and zero hits for it); and a
      # bundler-only breakage used to merge green and surface only after a tag
      # had been pushed and the native Rust legs had already burned.
      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test
