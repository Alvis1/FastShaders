name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref: pushing twice in a minute should not leave two suites racing
# for the same answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite reads the a-frame-shaderloader submodule directly:
          # `vendorSync.test.ts` compares it against the tracked public/js/
          # copies, and `perMeshMaterials.test.ts` reads loader 0.6's own source
          # to state WHY the vendored gate has to match. Without this, that read
          # is an ENOENT and CI is red for a reason that has nothing to do with
          # the change being tested — which is how it sat failing from v0.3.23
          # while every release stayed green (release.yml checks out submodules
          # on all three of its jobs, and runs the same `npm test`).
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` (tsc -b && vite build), NOT `tsc --noEmit`. Two holes
      # close together: --noEmit does not follow project references, so
      # vite.config.ts — which owns the build CSP, the FS_DESKTOP profile, every
      # custom plugin and the rollup input map — was never typechecked at all
      # (--listFiles showed 884 src files and zero hits for it); and a
      # bundler-only breakage used to merge green and surface only after a tag
      # had been pushed and the native Rust legs had already burned.
      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm test
