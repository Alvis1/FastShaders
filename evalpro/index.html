<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="../images/favicon-app.svg" />
  <title>FastShaders — evaluation session</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 2rem;">Starting the FastShaders evaluation session…</p>
  <script>
    // The PROFESSIONAL arm: the ordinary study plus a block of questions after
    // the SUS (src/eval/proQuestions.ts). The app keys that block, the 18+
    // exemption and the always-visible points on `arm=evalpro` alone; `pro=on`
    // is still written for older readers. ?task=…&budget=… still work here.
    //
    // A separate ENTRY rather than a flag the researcher must remember: which
    // questionnaire a participant gets must not depend on typing a query
    // string correctly, and "/evalpro" is one word to hand someone.
    try {
      sessionStorage.setItem('fs:evalArm', '1');
      sessionStorage.removeItem('fs:evalSession');
      // SET, never appended (see /evalp: the FIRST occurrence wins, so
      // `?pro=off&pro=on` dropped the professional block). `arm` names this
      // entry the same way (evalTask.ts).
      var p = new URLSearchParams(location.search);
      p.set('pro', 'on');
      p.set('arm', 'evalpro');
      var q = '?' + p.toString();
      // An over-long link keeps only what this entry forces — never NOTHING,
      // which would drop the participant out of this entry's condition.
      if (q.length >= 2048) q = '?pro=on&arm=evalpro';
      sessionStorage.setItem('fs:evalTaskQuery', q);
    } catch (e) { /* storage blocked — the app just boots normally */ }
    location.replace('../');
  </script>
  <noscript>
    <p style="font-family: sans-serif; padding: 0 2rem;">
      JavaScript is required. Open the app at <a href="../">the main page</a>.
    </p>
  </noscript>
</body>
</html>
